<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Production Tracker - Admin</title>
<link rel="manifest" href="manifest.json">
<link rel="stylesheet" href="style.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>

<div class="pr-header">
    <h1>Admin Panel</h1>
    <button class="logout-btn" style="background:#555;" onclick="window.location.href='home.html'">Back</button>
</div>

<div class="pr-tabs">
    <div class="pr-tab active" data-tab="fab" onclick="switchTab('fab')">Fab Steps</div>
    <div class="pr-tab" data-tab="paint" onclick="switchTab('paint')">Paint</div>
    <div class="pr-tab" data-tab="units" onclick="switchTab('units')">Units</div>
    <div class="pr-tab" data-tab="inspectors" onclick="switchTab('inspectors')">Inspectors</div>
    <div class="pr-tab" data-tab="workers" onclick="switchTab('workers')">Workers</div>
    <div class="pr-tab" data-tab="jobs" onclick="switchTab('jobs')">Jobs</div>
    <div class="pr-tab" data-tab="formats" onclick="switchTab('formats')">Format</div>
</div>

<div class="pr-container">

    <!-- FAB STEPS -->
    <div id="tab-fab" class="tab-content">
        <div class="pr-card">
            <label class="pr-label">Add Fab Step</label>
            <input type="text" id="newFabStepName" class="pr-input" placeholder="Step name">
            <input type="number" id="newFabStepOrder" class="pr-input" placeholder="Order number (e.g. 37)">
            <select id="newFabStepFormat" class="pr-select"><option value="">-- No inspection format --</option></select>
            <button class="pr-btn pr-btn-primary" onclick="addFabStep()">Add Step</button>
        </div>
        <div id="fabStepsList"><p class="pr-empty">Loading...</p></div>
    </div>

    <!-- PAINT -->
    <div id="tab-paint" class="tab-content" style="display:none;">
        <div class="pr-card">
            <label class="pr-label">Add Paint Item (e.g. Tank, Top Cover)</label>
            <input type="text" id="newPaintItemName" class="pr-input" placeholder="Item name">
            <button class="pr-btn pr-btn-primary" onclick="addPaintItem()">Add Item</button>
        </div>
        <div id="paintItemsList"><p class="pr-empty">Loading...</p></div>

        <div class="pr-card" style="margin-top:16px;">
            <label class="pr-label">Add Paint Process to Item</label>
            <select id="paintProcessItemSelect" class="pr-select"></select>
            <input type="text" id="newPaintProcessName" class="pr-input" placeholder="Process name">
            <input type="number" id="newPaintProcessOrder" class="pr-input" placeholder="Order number">
            <select id="newPaintProcessFormat" class="pr-select"><option value="">-- No inspection format --</option></select>
            <button class="pr-btn pr-btn-primary" onclick="addPaintProcess()">Add Process</button>
        </div>
        <div id="paintProcessesList"></div>
    </div>

    <!-- UNITS -->
    <div id="tab-units" class="tab-content" style="display:none;">
        <div class="pr-card">
            <label class="pr-label">Add Unit</label>
            <input type="text" id="newUnitName" class="pr-input" placeholder="e.g. Unit-3">
            <button class="pr-btn pr-btn-primary" onclick="addUnit()">Add Unit</button>
        </div>
        <div id="unitsList"><p class="pr-empty">Loading...</p></div>
    </div>

    <!-- INSPECTORS -->
    <div id="tab-inspectors" class="tab-content" style="display:none;">
        <div class="pr-card">
            <label class="pr-label">Add Inspector</label>
            <input type="text" id="newInspectorName" class="pr-input" placeholder="Inspector name">
            <button class="pr-btn pr-btn-primary" onclick="addInspector()">Add Inspector</button>
        </div>
        <div id="inspectorsList"><p class="pr-empty">Loading...</p></div>
    </div>

    <!-- WORKERS -->
    <div id="tab-workers" class="tab-content" style="display:none;">
        <div class="pr-card">
            <label class="pr-label">Add Worker</label>
            <input type="text" id="newWorkerName" class="pr-input" placeholder="Worker name">
            <input type="text" id="newWorkerCategory" class="pr-input" placeholder="Category (e.g. Welder, Plasma Operator)">
            <button class="pr-btn pr-btn-primary" onclick="addWorker()">Add Worker</button>
        </div>
        <div id="workersMasterList"><p class="pr-empty">Loading...</p></div>
    </div>

    <!-- JOBS -->
    <div id="tab-jobs" class="tab-content" style="display:none;">
        <div id="jobsList"><p class="pr-empty">Loading...</p></div>
    </div>

    <!-- INSPECTION FORMATS -->
    <div id="tab-formats" class="tab-content" style="display:none;">
        <div class="pr-card">
            <label class="pr-label">Add Inspection Format</label>
            <input type="text" id="newFormatCode" class="pr-input" placeholder="Code (e.g. FM1)">
            <input type="text" id="newFormatName" class="pr-input" placeholder="Name (e.g. Welding Inspection Report)">
            <button class="pr-btn pr-btn-primary" onclick="addInspectionFormat()">Add Format</button>
        </div>
        <div id="formatsList"><p class="pr-empty">Loading...</p></div>
    </div>

</div>

<script src="config.js"></script>
<script>

const session = requireLogin();

if (session.role !== 'Admin') {
    window.location.href = 'home.html';
}

function switchTab(tab) {
    document.querySelectorAll('.tab-content').forEach(el => el.style.display = 'none');
    document.querySelectorAll('.pr-tab').forEach(el => el.classList.remove('active'));
    document.getElementById('tab-' + tab).style.display = 'block';
    document.querySelector('.pr-tab[data-tab="' + tab + '"]').classList.add('active');

    if (tab === 'fab') loadFabSteps();
    if (tab === 'paint') { loadPaintItems(); }
    if (tab === 'units') loadUnits();
    if (tab === 'inspectors') loadInspectors();
    if (tab === 'workers') loadWorkersMaster();
    if (tab === 'jobs') loadJobsAdmin();
    if (tab === 'formats') loadInspectionFormats();
}

// ============ SHARED: inspection format select population ============
async function fetchActiveFormats() {
    const { data } = await supabaseClient.from('pr_inspection_formats_master').select('id, code, name').eq('company_id', session.companyId).eq('is_active', true).order('code');
    return data || [];
}

function populateFormatSelect(selectEl, formats, currentFormatId) {
    selectEl.innerHTML = '<option value="">-- No inspection format --</option>';
    formats.forEach(f => {
        const opt = document.createElement('option');
        opt.value = f.id;
        opt.textContent = f.code + ' — ' + f.name;
        if (currentFormatId === f.id) opt.selected = true;
        selectEl.appendChild(opt);
    });
}

// ============ FAB STEPS ============
async function loadFabSteps() {
    const container = document.getElementById('fabStepsList');
    container.innerHTML = '<p class="pr-empty">Loading...</p>';
    const [{ data, error }, formats] = await Promise.all([
        supabaseClient.from('pr_fab_steps_master').select('*, pr_inspection_formats_master(code, name)').eq('company_id', session.companyId).order('step_order'),
        fetchActiveFormats()
    ]);
    if (error) { container.innerHTML = '<p class="pr-empty">⚠️ Could not load: ' + error.message + '</p>'; return; }

    populateFormatSelect(document.getElementById('newFabStepFormat'), formats, null);

    let html = '<table class="pr-table"><tr><th>#</th><th>Step Name</th><th>Insp. Format</th><th>Status</th><th></th></tr>';
    (data || []).forEach(s => {
        const jsName = s.step_name.replace(/'/g, "\\'");
        html += '<tr><td>' + s.step_order + '</td><td>' + escapeHtml(s.step_name) + '</td>';
        html += '<td>' + (s.pr_inspection_formats_master ? escapeHtml(s.pr_inspection_formats_master.code) : '-') + '</td>';
        html += '<td><span class="pr-badge pr-badge-' + (s.is_active ? 'accept' : 'reject') + '">' + (s.is_active ? 'Active' : 'Inactive') + '</span></td>';
        html += '<td style="display:flex; gap:6px; flex-wrap:wrap;">';
        html += '<button class="pr-btn pr-btn-outline" onclick="toggleActive(\'pr_fab_steps_master\',\'' + s.id + '\',' + s.is_active + ',loadFabSteps)">' + (s.is_active ? 'Deactivate' : 'Activate') + '</button>';
        html += '<button class="pr-btn pr-btn-outline" onclick="toggleFabStepEditRow(\'' + s.id + '\')">Edit</button>';
        html += '<button class="pr-btn pr-btn-danger" onclick="deleteFabStep(\'' + s.id + '\',\'' + jsName + '\')">Delete</button>';
        html += '</td></tr>';

        html += '<tr id="fabStepEditRow_' + s.id + '" style="display:none;"><td colspan="5">';
        html += '<div class="pr-card">';
        html += '<label class="pr-label">Step Name</label><input type="text" class="pr-input" id="fabStepName_' + s.id + '" value="' + escapeHtml(s.step_name) + '">';
        html += '<label class="pr-label">Order Number</label><input type="number" class="pr-input" id="fabStepOrder_' + s.id + '" value="' + s.step_order + '">';
        html += '<label class="pr-label">Inspection Format</label><select class="pr-select" id="fabStepFormat_' + s.id + '"></select>';
        html += '<div style="display:flex; gap:8px; margin-top:8px;">';
        html += '<button class="pr-btn pr-btn-primary" onclick="saveFabStepEdit(\'' + s.id + '\',' + s.step_order + ')">Save Changes</button>';
        html += '<button class="pr-btn pr-btn-outline" onclick="toggleFabStepEditRow(\'' + s.id + '\')">Cancel</button>';
        html += '</div></div>';
        html += '</td></tr>';
    });
    html += '</table>';
    container.innerHTML = html;

    (data || []).forEach(s => {
        populateFormatSelect(document.getElementById('fabStepFormat_' + s.id), formats, s.inspection_format_id);
    });
}

function toggleFabStepEditRow(id) {
    const row = document.getElementById('fabStepEditRow_' + id);
    row.style.display = (row.style.display === 'none') ? 'table-row' : 'none';
}

async function saveFabStepEdit(id, currentOrder) {
    const newName = document.getElementById('fabStepName_' + id).value.trim();
    const newOrder = parseInt(document.getElementById('fabStepOrder_' + id).value);
    const formatId = document.getElementById('fabStepFormat_' + id).value;
    if (!newName || !newOrder) { alert('Invalid name or order number'); return; }

    if (newOrder !== currentOrder) {
        if (newOrder > currentOrder) {
            const { data: toShift } = await supabaseClient
                .from('pr_fab_steps_master')
                .select('id, step_order')
                .eq('company_id', session.companyId)
                .gt('step_order', currentOrder)
                .lte('step_order', newOrder)
                .neq('id', id)
                .order('step_order', { ascending: true });
            for (const s of (toShift || [])) {
                const { error: shiftError } = await supabaseClient.from('pr_fab_steps_master').update({ step_order: s.step_order - 1 }).eq('id', s.id);
                if (shiftError) { alert('Error renumbering: ' + shiftError.message); return; }
            }
        } else {
            const { data: toShift } = await supabaseClient
                .from('pr_fab_steps_master')
                .select('id, step_order')
                .eq('company_id', session.companyId)
                .gte('step_order', newOrder)
                .lt('step_order', currentOrder)
                .neq('id', id)
                .order('step_order', { ascending: false });
            for (const s of (toShift || [])) {
                const { error: shiftError } = await supabaseClient.from('pr_fab_steps_master').update({ step_order: s.step_order + 1 }).eq('id', s.id);
                if (shiftError) { alert('Error renumbering: ' + shiftError.message); return; }
            }
        }
    }

    const { error } = await supabaseClient.from('pr_fab_steps_master').update({ step_name: newName, step_order: newOrder, inspection_format_id: formatId || null }).eq('id', id);
    if (error) { alert('Error: ' + error.message); return; }
    loadFabSteps();
}

async function deleteFabStep(id, name) {
    if (!confirm('Delete fab step "' + name + '" permanently?')) return;
    const { error } = await supabaseClient.from('pr_fab_steps_master').delete().eq('id', id);
    if (!error) { loadFabSteps(); return; }

    const { count } = await supabaseClient.from('pr_fab_tracking').select('id', { count: 'exact', head: true }).eq('fab_step_id', id);
    const forceMsg = 'This step is used in ' + (count || 'some') + ' job(s)\' tracking data, so it can\'t be deleted directly.\n\nForce delete will PERMANENTLY remove this step\'s records (dates, remarks, inspection status, worker/inspector assignments, any inspection sheet) from EVERY job that has it. This cannot be undone.\n\nForce delete anyway?';
    if (!confirm(forceMsg)) return;

    const { error: trackingError } = await supabaseClient.from('pr_fab_tracking').delete().eq('fab_step_id', id);
    if (trackingError) { alert('Error force-deleting: ' + trackingError.message); return; }

    const { error: retryError } = await supabaseClient.from('pr_fab_steps_master').delete().eq('id', id);
    if (retryError) { alert('Error: ' + retryError.message); return; }
    loadFabSteps();
}

async function addFabStep() {
    const name = document.getElementById('newFabStepName').value.trim();
    const order = parseInt(document.getElementById('newFabStepOrder').value);
    const formatId = document.getElementById('newFabStepFormat').value;
    if (!name || !order) { alert('Enter step name and order number'); return; }

    // Shift every existing step at/after this position up by 1, highest first, so inserting mid-sequence doesn't collide
    const { data: toShift } = await supabaseClient
        .from('pr_fab_steps_master')
        .select('id, step_order')
        .eq('company_id', session.companyId)
        .gte('step_order', order)
        .order('step_order', { ascending: false });

    for (const s of (toShift || [])) {
        const { error: shiftError } = await supabaseClient.from('pr_fab_steps_master').update({ step_order: s.step_order + 1 }).eq('id', s.id);
        if (shiftError) { alert('Error renumbering existing steps: ' + shiftError.message); return; }
    }

    const { error } = await supabaseClient.from('pr_fab_steps_master').insert({ company_id: session.companyId, step_name: name, step_order: order, inspection_format_id: formatId || null });
    if (error) { alert('Error: ' + error.message); return; }
    document.getElementById('newFabStepName').value = '';
    document.getElementById('newFabStepOrder').value = '';
    loadFabSteps();
}

// ============ PAINT ITEMS + PROCESSES ============
async function loadPaintItems() {
    const container = document.getElementById('paintItemsList');
    container.innerHTML = '<p class="pr-empty">Loading...</p>';
    const { data, error } = await supabaseClient.from('pr_paint_items_master').select('*').eq('company_id', session.companyId).order('item_name');
    if (error) { container.innerHTML = '<p class="pr-empty">⚠️ Could not load: ' + error.message + '</p>'; return; }

    let html = '<table class="pr-table"><tr><th>Item Name</th><th>Status</th><th></th></tr>';
    (data || []).forEach(i => {
        const jsName = i.item_name.replace(/'/g, "\\'");
        html += '<tr><td>' + escapeHtml(i.item_name) + '</td>';
        html += '<td><span class="pr-badge pr-badge-' + (i.is_active ? 'accept' : 'reject') + '">' + (i.is_active ? 'Active' : 'Inactive') + '</span></td>';
        html += '<td style="display:flex; gap:6px; flex-wrap:wrap;">';
        html += '<button class="pr-btn pr-btn-outline" onclick="toggleActive(\'pr_paint_items_master\',\'' + i.id + '\',' + i.is_active + ',loadPaintItems)">' + (i.is_active ? 'Deactivate' : 'Activate') + '</button>';
        html += '<button class="pr-btn pr-btn-outline" onclick="editPaintItem(\'' + i.id + '\',\'' + jsName + '\')">Edit</button>';
        html += '<button class="pr-btn pr-btn-danger" onclick="deletePaintItem(\'' + i.id + '\',\'' + jsName + '\')">Delete</button>';
        html += '</td></tr>';
    });
    html += '</table>';
    container.innerHTML = html;

    // Populate item selector for adding processes
    const sel = document.getElementById('paintProcessItemSelect');
    sel.innerHTML = '';
    (data || []).filter(i => i.is_active).forEach(i => {
        const opt = document.createElement('option');
        opt.value = i.id;
        opt.textContent = i.item_name;
        sel.appendChild(opt);
    });
    sel.onchange = loadPaintProcesses;
    if (data && data.length > 0) loadPaintProcesses();
}

async function addPaintItem() {
    const name = document.getElementById('newPaintItemName').value.trim();
    if (!name) { alert('Enter item name'); return; }
    const { error } = await supabaseClient.from('pr_paint_items_master').insert({ company_id: session.companyId, item_name: name });
    if (error) { alert('Error: ' + error.message); return; }
    document.getElementById('newPaintItemName').value = '';
    loadPaintItems();
}

async function editPaintItem(id, currentName) {
    const newName = prompt('Item name:', currentName);
    if (newName === null) return;
    if (!newName.trim()) { alert('Invalid name'); return; }
    const { error } = await supabaseClient.from('pr_paint_items_master').update({ item_name: newName.trim() }).eq('id', id);
    if (error) { alert('Error: ' + error.message); return; }
    loadPaintItems();
}

async function deletePaintItem(id, name) {
    if (!confirm('Delete paint item "' + name + '" permanently? If it already has processes or job tracking data, deletion will fail — use Deactivate instead in that case.')) return;
    const { error } = await supabaseClient.from('pr_paint_items_master').delete().eq('id', id);
    if (error) { alert('Error deleting: ' + error.message + '\n\nThis item likely still has processes or tracking data linked. Use Deactivate instead.'); return; }
    loadPaintItems();
}

async function loadPaintProcesses() {
    const itemId = document.getElementById('paintProcessItemSelect').value;
    const container = document.getElementById('paintProcessesList');
    if (!itemId) { container.innerHTML = ''; return; }
    container.innerHTML = '<p class="pr-empty">Loading...</p>';

    const [{ data, error }, formats] = await Promise.all([
        supabaseClient.from('pr_paint_process_master').select('*, pr_inspection_formats_master(code, name)').eq('paint_item_id', itemId).order('process_order'),
        fetchActiveFormats()
    ]);
    if (error) { container.innerHTML = '<p class="pr-empty">⚠️ Could not load: ' + error.message + '</p>'; return; }

    populateFormatSelect(document.getElementById('newPaintProcessFormat'), formats, null);

    let html = '<table class="pr-table"><tr><th>#</th><th>Process Name</th><th>Insp. Format</th><th>Status</th><th></th></tr>';
    (data || []).forEach(p => {
        const jsName = p.process_name.replace(/'/g, "\\'");
        html += '<tr><td>' + p.process_order + '</td><td>' + escapeHtml(p.process_name) + '</td>';
        html += '<td>' + (p.pr_inspection_formats_master ? escapeHtml(p.pr_inspection_formats_master.code) : '-') + '</td>';
        html += '<td><span class="pr-badge pr-badge-' + (p.is_active ? 'accept' : 'reject') + '">' + (p.is_active ? 'Active' : 'Inactive') + '</span></td>';
        html += '<td style="display:flex; gap:6px; flex-wrap:wrap;">';
        html += '<button class="pr-btn pr-btn-outline" onclick="toggleActive(\'pr_paint_process_master\',\'' + p.id + '\',' + p.is_active + ',loadPaintProcesses)">' + (p.is_active ? 'Deactivate' : 'Activate') + '</button>';
        html += '<button class="pr-btn pr-btn-outline" onclick="toggleProcessEditRow(\'' + p.id + '\')">Edit</button>';
        html += '<button class="pr-btn pr-btn-danger" onclick="deletePaintProcess(\'' + p.id + '\',\'' + jsName + '\')">Delete</button>';
        html += '</td></tr>';

        html += '<tr id="processEditRow_' + p.id + '" style="display:none;"><td colspan="5">';
        html += '<div class="pr-card">';
        html += '<label class="pr-label">Process Name</label><input type="text" class="pr-input" id="processName_' + p.id + '" value="' + escapeHtml(p.process_name) + '">';
        html += '<label class="pr-label">Order Number</label><input type="number" class="pr-input" id="processOrder_' + p.id + '" value="' + p.process_order + '">';
        html += '<label class="pr-label">Inspection Format</label><select class="pr-select" id="processFormat_' + p.id + '"></select>';
        html += '<div style="display:flex; gap:8px; margin-top:8px;">';
        html += '<button class="pr-btn pr-btn-primary" onclick="saveProcessEdit(\'' + p.id + '\',\'' + itemId + '\',' + p.process_order + ')">Save Changes</button>';
        html += '<button class="pr-btn pr-btn-outline" onclick="toggleProcessEditRow(\'' + p.id + '\')">Cancel</button>';
        html += '</div></div>';
        html += '</td></tr>';
    });
    html += '</table>';
    container.innerHTML = html;

    (data || []).forEach(p => {
        populateFormatSelect(document.getElementById('processFormat_' + p.id), formats, p.inspection_format_id);
    });
}

function toggleProcessEditRow(id) {
    const row = document.getElementById('processEditRow_' + id);
    row.style.display = (row.style.display === 'none') ? 'table-row' : 'none';
}

async function saveProcessEdit(id, itemId, currentOrder) {
    const newName = document.getElementById('processName_' + id).value.trim();
    const newOrder = parseInt(document.getElementById('processOrder_' + id).value);
    const formatId = document.getElementById('processFormat_' + id).value;
    if (!newName || !newOrder) { alert('Invalid name or order number'); return; }

    if (newOrder !== currentOrder) {
        if (newOrder > currentOrder) {
            const { data: toShift } = await supabaseClient
                .from('pr_paint_process_master')
                .select('id, process_order')
                .eq('paint_item_id', itemId)
                .gt('process_order', currentOrder)
                .lte('process_order', newOrder)
                .neq('id', id)
                .order('process_order', { ascending: true });
            for (const p of (toShift || [])) {
                const { error: shiftError } = await supabaseClient.from('pr_paint_process_master').update({ process_order: p.process_order - 1 }).eq('id', p.id);
                if (shiftError) { alert('Error renumbering: ' + shiftError.message); return; }
            }
        } else {
            const { data: toShift } = await supabaseClient
                .from('pr_paint_process_master')
                .select('id, process_order')
                .eq('paint_item_id', itemId)
                .gte('process_order', newOrder)
                .lt('process_order', currentOrder)
                .neq('id', id)
                .order('process_order', { ascending: false });
            for (const p of (toShift || [])) {
                const { error: shiftError } = await supabaseClient.from('pr_paint_process_master').update({ process_order: p.process_order + 1 }).eq('id', p.id);
                if (shiftError) { alert('Error renumbering: ' + shiftError.message); return; }
            }
        }
    }

    const { error } = await supabaseClient.from('pr_paint_process_master').update({ process_name: newName, process_order: newOrder, inspection_format_id: formatId || null }).eq('id', id);
    if (error) { alert('Error: ' + error.message); return; }
    loadPaintProcesses();
}

async function deletePaintProcess(id, name) {
    if (!confirm('Delete paint process "' + name + '" permanently?')) return;
    const { error } = await supabaseClient.from('pr_paint_process_master').delete().eq('id', id);
    if (!error) { loadPaintProcesses(); return; }

    const { count } = await supabaseClient.from('pr_paint_tracking').select('id', { count: 'exact', head: true }).eq('process_id', id);
    const forceMsg = 'This process is used in ' + (count || 'some') + ' job(s)\' tracking data, so it can\'t be deleted directly.\n\nForce delete will PERMANENTLY remove this process\'s records (dates, remarks, any inspection sheet) from EVERY job that has it. This cannot be undone.\n\nForce delete anyway?';
    if (!confirm(forceMsg)) return;

    const { error: trackingError } = await supabaseClient.from('pr_paint_tracking').delete().eq('process_id', id);
    if (trackingError) { alert('Error force-deleting: ' + trackingError.message); return; }

    const { error: retryError } = await supabaseClient.from('pr_paint_process_master').delete().eq('id', id);
    if (retryError) { alert('Error: ' + retryError.message); return; }
    loadPaintProcesses();
}

async function addPaintProcess() {
    const itemId = document.getElementById('paintProcessItemSelect').value;
    const name = document.getElementById('newPaintProcessName').value.trim();
    const order = parseInt(document.getElementById('newPaintProcessOrder').value);
    const formatId = document.getElementById('newPaintProcessFormat').value;
    if (!itemId || !name || !order) { alert('Select item, enter process name and order'); return; }

    // Shift every existing process at/after this position up by 1, highest first, so inserting mid-sequence doesn't collide
    const { data: toShift } = await supabaseClient
        .from('pr_paint_process_master')
        .select('id, process_order')
        .eq('paint_item_id', itemId)
        .gte('process_order', order)
        .order('process_order', { ascending: false });

    for (const p of (toShift || [])) {
        const { error: shiftError } = await supabaseClient.from('pr_paint_process_master').update({ process_order: p.process_order + 1 }).eq('id', p.id);
        if (shiftError) { alert('Error renumbering existing processes: ' + shiftError.message); return; }
    }

    const { error } = await supabaseClient.from('pr_paint_process_master').insert({ company_id: session.companyId, paint_item_id: itemId, process_name: name, process_order: order, inspection_format_id: formatId || null });
    if (error) { alert('Error: ' + error.message); return; }
    document.getElementById('newPaintProcessName').value = '';
    document.getElementById('newPaintProcessOrder').value = '';
    loadPaintProcesses();
}

    if (!code || !name) { alert('Enter format code and name'); return; }

    if (error) { alert('Error: ' + error.message); return; }
    document.getElementById('newFormatCode').value = '';
    document.getElementById('newFormatName').value = '';

}

async function saveFormatEdit(id) {
    const newCode = document.getElementById('formatCode_' + id).value.trim();
    const newName = document.getElementById('formatName_' + id).value.trim();
    if (!newCode || !newName) { alert('Invalid code or name'); return; }
    const { error } = await supabaseClient.from('pr_inspection_formats_master').update({ code: newCode, name: newName }).eq('id', id);
    if (error) { alert('Error: ' + error.message); return; }
    loadInspectionFormats();
}

async function uploadFormatTemplate(formatId) {
    const fileInput = document.getElementById('formatTemplateInput_' + formatId);
    const file = fileInput.files[0];
    if (!file) { alert('Choose a file first'); return; }

    const path = session.companyId + '/templates/' + formatId + '/' + file.name;
    const { error: uploadError } = await supabaseClient.storage.from('inspection-sheets').upload(path, file, { upsert: true });
    if (uploadError) { alert('Error uploading: ' + uploadError.message); return; }

    const { error } = await supabaseClient.from('pr_inspection_formats_master').update({ template_file_path: path, template_file_name: file.name }).eq('id', formatId);
    if (error) { alert('Error saving: ' + error.message); return; }
    loadInspectionFormats();
}

async function viewFormatTemplate(formatId) {
    const { data: fmt } = await supabaseClient.from('pr_inspection_formats_master').select('template_file_path').eq('id', formatId).maybeSingle();
    if (!fmt || !fmt.template_file_path) { alert('No template uploaded'); return; }
    const { data, error } = await supabaseClient.storage.from('inspection-sheets').createSignedUrl(fmt.template_file_path, 300);
    if (error) { alert('Error: ' + error.message); return; }
    window.open(data.signedUrl, '_blank');
}

async function deleteFormatTemplate(formatId) {
    if (!confirm('Remove the master template for this format? Jobs already created will keep their own copy; only future new jobs are affected.')) return;
    const { data: fmt } = await supabaseClient.from('pr_inspection_formats_master').select('template_file_path').eq('id', formatId).maybeSingle();
    if (fmt && fmt.template_file_path) {
        await supabaseClient.storage.from('inspection-sheets').remove([fmt.template_file_path]);
    }
    const { error } = await supabaseClient.from('pr_inspection_formats_master').update({ template_file_path: null, template_file_name: null }).eq('id', formatId);
    if (error) { alert('Error: ' + error.message); return; }
    loadInspectionFormats();
}

async function deleteInspectionFormat(id, code) {
    if (!confirm('Delete inspection format "' + code + '" permanently?')) return;
    const { error } = await supabaseClient.from('pr_inspection_formats_master').delete().eq('id', id);
    if (!error) { loadInspectionFormats(); return; }

    const forceMsg = 'This format is attached to one or more steps and/or has inspection sheets already using it.\n\nForce delete will detach it from those steps and PERMANENTLY delete any inspection sheets (including uploaded files) and the master template that used it. This cannot be undone.\n\nForce delete anyway?';
    if (!confirm(forceMsg)) return;

    await supabaseClient.from('pr_fab_steps_master').update({ inspection_format_id: null }).eq('inspection_format_id', id);
    await supabaseClient.from('pr_paint_process_master').update({ inspection_format_id: null }).eq('inspection_format_id', id);

    const { data: reports } = await supabaseClient.from('pr_inspection_reports').select('id, file_path').eq('format_id', id);
    const filePaths = (reports || []).filter(r => r.file_path).map(r => r.file_path);
    if (filePaths.length > 0) {
        await supabaseClient.storage.from('inspection-sheets').remove(filePaths);
    }
    if (reports && reports.length > 0) {
        await supabaseClient.from('pr_inspection_reports').delete().eq('format_id', id);
    }

    const { data: fmt } = await supabaseClient.from('pr_inspection_formats_master').select('template_file_path').eq('id', id).maybeSingle();
    if (fmt && fmt.template_file_path) {
        await supabaseClient.storage.from('inspection-sheets').remove([fmt.template_file_path]);
    }

    const { error: retryError } = await supabaseClient.from('pr_inspection_formats_master').delete().eq('id', id);
    if (retryError) { alert('Error: ' + retryError.message); return; }
    loadInspectionFormats();
}

// ============ SHARED HELPERS ============
function escapeHtml(str) {
    return (str || '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
}

// ============ SHARED TOGGLE ============
async function toggleActive(table, id, currentState, reloadFn) {
    const { error } = await supabaseClient.from(table).update({ is_active: !currentState }).eq('id', id);
    if (error) { alert('Error: ' + error.message); return; }
    reloadFn();
}

if (session) loadFabSteps();
