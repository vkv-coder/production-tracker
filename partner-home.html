<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Production Tracker - My Steps</title>
<link rel="manifest" href="manifest.json">
<link rel="stylesheet" href="style.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>

<div class="pr-header">
    <h1>My Assigned Steps</h1>
    <button class="logout-btn" onclick="clearSession(); window.location.href='index.html';">Logout</button>
</div>

<div class="pr-container">
    <p style="font-size:13px; color:#666; margin-top:-8px;">Logged in as <strong id="workerName"></strong></p>
    <div class="pr-tabs">
        <div class="pr-tab active" data-maintab="process" onclick="switchMainTab('process')">Process</div>
        <div class="pr-tab" data-maintab="iso" onclick="switchMainTab('iso')">ISO</div>
    </div>
    <div id="mainTab-process">
        <div id="jobTabs" style="display:flex; gap:8px; flex-wrap:wrap; margin:12px 0;"></div>
        <div id="stepsList"><p class="pr-empty">Loading...</p></div>
    </div>
    <div id="mainTab-iso" style="display:none; margin-top:12px;">
        <div id="isoList"><p class="pr-empty">Loading...</p></div>
    </div>
</div>

<script src="config.js"></script>
<script>

const session = requireLogin();
if (session && session.role !== 'Partner') {
    window.location.href = 'home.html';
}

let jobGroups = {}; // jobId -> { job, items: [] }
let currentJobId = null;

function switchMainTab(tab) {
    document.querySelectorAll('.pr-tab[data-maintab]').forEach(el => el.classList.remove('active'));
    document.querySelector('.pr-tab[data-maintab="' + tab + '"]').classList.add('active');
    document.getElementById('mainTab-process').style.display = (tab === 'process') ? 'block' : 'none';
    document.getElementById('mainTab-iso').style.display = (tab === 'iso') ? 'block' : 'none';
    if (tab === 'iso') loadIsoFormats();
}

async function loadIsoFormats() {
    const container = document.getElementById('isoList');
    container.innerHTML = '<p class="pr-empty">Loading...</p>';

    const { data: assignments } = await supabaseClient
        .from('pr_iso_format_assignments')
        .select('pr_inspection_formats_master(id, code, name, is_active)')
        .eq('inspector_id', session.userId);

    const formats = (assignments || []).map(a => a.pr_inspection_formats_master).filter(f => f && f.is_active);
    if (formats.length === 0) {
        container.innerHTML = '<p class="pr-empty">No ISO formats assigned to you yet.</p>';
        return;
    }

    let html = '';
    formats.forEach(f => {
        html += '<div class="pr-card">';
        html += '<div class="pr-card-title">' + escapeHtml(f.code) + '</div>';
        html += '<div class="pr-card-sub">' + escapeHtml(f.name) + '</div>';
        html += '<a class="pr-btn pr-btn-primary" style="display:inline-block; margin-top:8px;" href="inspection-report.html?isoformat=' + f.id + '">Open &amp; Fill</a>';
        html += '</div>';
    });
    container.innerHTML = html;
}

async function loadAssignedSteps() {
    document.getElementById('workerName').textContent = session.name;
    const container = document.getElementById('stepsList');
    const tabsContainer = document.getElementById('jobTabs');
    container.innerHTML = '<p class="pr-empty">Loading...</p>';
    tabsContainer.innerHTML = '';

    const [{ data: fabAssignments }, { data: paintAssignments }, { data: supervisorJobs }] = await Promise.all([
        supabaseClient
            .from('pr_fab_tracking_inspectors')
            .select('pr_fab_tracking(id, job_id, planned_start, planned_end, actual_start, actual_end, start_delay_reason, end_delay_reason, pr_jobs(job_no, customer_name, status), pr_fab_steps_master(step_name, step_order))')
            .eq('inspector_id', session.userId),
        supabaseClient
            .from('pr_paint_tracking_inspectors')
            .select('pr_paint_tracking(id, job_id, start_date, stop_date, remarks, pr_jobs(job_no, customer_name, status), pr_paint_process_master(process_name, process_order))')
            .eq('inspector_id', session.userId),
        supabaseClient
            .from('pr_jobs')
            .select('id, job_no, customer_name, status')
            .eq('supervisor_inspector_id', session.userId)
    ]);

    // Supervisor: pull in EVERY process of their supervised jobs, not just
    // steps they're personally assigned to - computed first so items built
    // below (both directly-assigned and supervisor-added) can be tagged with
    // whether the viewer is allowed to edit Actual Start/End + delay reason
    // on them (only true for a job they're supervisor on).
    const supervisorJobMap = {};
    (supervisorJobs || []).forEach(j => { supervisorJobMap[j.id] = j; });
    const supervisorJobIds = new Set(Object.keys(supervisorJobMap));

    const items = [];
    const seenFab = new Set(), seenPaint = new Set();
    (fabAssignments || []).forEach(a => {
        const t = a.pr_fab_tracking;
        if (t) { items.push({ type: 'fab', trackingId: t.id, jobId: t.job_id, job: t.pr_jobs, stepName: t.pr_fab_steps_master?.step_name, order: t.pr_fab_steps_master?.step_order, isSupervisor: supervisorJobIds.has(t.job_id), plannedStart: t.planned_start, plannedEnd: t.planned_end, actualStart: t.actual_start, actualEnd: t.actual_end, startDelayReason: t.start_delay_reason, endDelayReason: t.end_delay_reason }); seenFab.add(t.id); }
    });
    (paintAssignments || []).forEach(a => {
        const t = a.pr_paint_tracking;
        if (t) { items.push({ type: 'paint', trackingId: t.id, jobId: t.job_id, job: t.pr_jobs, stepName: t.pr_paint_process_master?.process_name, order: t.pr_paint_process_master?.process_order, isSupervisor: supervisorJobIds.has(t.job_id), startDate: t.start_date, stopDate: t.stop_date, remarks: t.remarks }); seenPaint.add(t.id); }
    });

    if (supervisorJobIds.size > 0) {
        const supervisorJobIdList = Array.from(supervisorJobIds);
        const [{ data: allFab }, { data: allPaint }] = await Promise.all([
            supabaseClient.from('pr_fab_tracking').select('id, job_id, planned_start, planned_end, actual_start, actual_end, start_delay_reason, end_delay_reason, pr_fab_steps_master(step_name, step_order)').in('job_id', supervisorJobIdList),
            supabaseClient.from('pr_paint_tracking').select('id, job_id, start_date, stop_date, remarks, pr_paint_process_master(process_name, process_order)').in('job_id', supervisorJobIdList)
        ]);
        (allFab || []).forEach(t => {
            if (!seenFab.has(t.id)) items.push({ type: 'fab', trackingId: t.id, jobId: t.job_id, job: supervisorJobMap[t.job_id], stepName: t.pr_fab_steps_master?.step_name, order: t.pr_fab_steps_master?.step_order, isSupervisor: true, plannedStart: t.planned_start, plannedEnd: t.planned_end, actualStart: t.actual_start, actualEnd: t.actual_end, startDelayReason: t.start_delay_reason, endDelayReason: t.end_delay_reason });
        });
        (allPaint || []).forEach(t => {
            if (!seenPaint.has(t.id)) items.push({ type: 'paint', trackingId: t.id, jobId: t.job_id, job: supervisorJobMap[t.job_id], stepName: t.pr_paint_process_master?.process_name, order: t.pr_paint_process_master?.process_order, isSupervisor: true, startDate: t.start_date, stopDate: t.stop_date, remarks: t.remarks });
        });
    }

    if (items.length === 0) {
        container.innerHTML = '<p class="pr-empty">No steps assigned to you yet.</p>';
        return;
    }

    // Gate on whether each job has actually started (Actual Start filled on
    // that job's first fab step) - bypasses our own assignment-scoped RLS
    // via a SECURITY DEFINER RPC. Jobs that haven't started are dropped
    // entirely (not just their sheet link) to avoid clutter.
    const distinctJobIds = [...new Set(items.map(i => i.jobId).filter(Boolean))];
    const startedMap = {};
    await Promise.all(distinctJobIds.map(async jobId => {
        const { data } = await supabaseClient.rpc('pr_job_has_started', { p_job_id: jobId });
        startedMap[jobId] = !!data;
    }));

    const startedItems = items.filter(item => startedMap[item.jobId]);
    if (startedItems.length === 0) {
        container.innerHTML = '<p class="pr-empty">No active jobs yet - your assigned sheets will appear here once a job actually starts.</p>';
        return;
    }

    // Batch-fetch every attached inspection format + image for these processes,
    // same shape as job-detail.html's read side.
    const fabTrackingIds = startedItems.filter(i => i.type === 'fab').map(i => i.trackingId);
    const paintTrackingIds = startedItems.filter(i => i.type === 'paint').map(i => i.trackingId);

    const [{ data: fabLinks }, { data: paintLinks }, { data: fabImages }, { data: paintImages }] = await Promise.all([
        fabTrackingIds.length ? supabaseClient.from('pr_fab_tracking_reports').select('fab_tracking_id, report_id, pr_inspection_reports(format_id, file_path, pr_inspection_formats_master(code))').in('fab_tracking_id', fabTrackingIds) : Promise.resolve({ data: [] }),
        paintTrackingIds.length ? supabaseClient.from('pr_paint_tracking_reports').select('paint_tracking_id, report_id, pr_inspection_reports(format_id, file_path, pr_inspection_formats_master(code))').in('paint_tracking_id', paintTrackingIds) : Promise.resolve({ data: [] }),
        fabTrackingIds.length ? supabaseClient.from('pr_process_attachments').select('id, fab_tracking_id, file_path, file_name').in('fab_tracking_id', fabTrackingIds) : Promise.resolve({ data: [] }),
        paintTrackingIds.length ? supabaseClient.from('pr_process_attachments').select('id, paint_tracking_id, file_path, file_name').in('paint_tracking_id', paintTrackingIds) : Promise.resolve({ data: [] })
    ]);

    const linksMap = {};
    (fabLinks || []).forEach(l => {
        const k = 'fab:' + l.fab_tracking_id;
        if (!linksMap[k]) linksMap[k] = [];
        linksMap[k].push({ reportId: l.report_id, code: l.pr_inspection_reports?.pr_inspection_formats_master?.code || 'Inspection', hasFile: !!l.pr_inspection_reports?.file_path });
    });
    (paintLinks || []).forEach(l => {
        const k = 'paint:' + l.paint_tracking_id;
        if (!linksMap[k]) linksMap[k] = [];
        linksMap[k].push({ reportId: l.report_id, code: l.pr_inspection_reports?.pr_inspection_formats_master?.code || 'Inspection', hasFile: !!l.pr_inspection_reports?.file_path });
    });

    const imagesMap = {};
    (fabImages || []).forEach(img => { const k = 'fab:' + img.fab_tracking_id; if (!imagesMap[k]) imagesMap[k] = []; imagesMap[k].push(img); });
    (paintImages || []).forEach(img => { const k = 'paint:' + img.paint_tracking_id; if (!imagesMap[k]) imagesMap[k] = []; imagesMap[k].push(img); });

    startedItems.forEach(item => {
        const k = item.type + ':' + item.trackingId;
        item.links = linksMap[k] || [];
        item.images = imagesMap[k] || [];
    });

    jobGroups = {};
    startedItems.forEach(item => {
        if (!jobGroups[item.jobId]) jobGroups[item.jobId] = { job: item.job, items: [] };
        jobGroups[item.jobId].items.push(item);
    });

    const jobIds = Object.keys(jobGroups);
    currentJobId = jobIds[0];

    if (jobIds.length > 1) {
        jobIds.forEach((jobId, idx) => {
            const label = jobGroups[jobId].job ? jobGroups[jobId].job.job_no : 'Job';
            const btn = document.createElement('button');
            btn.className = 'pr-btn ' + (idx === 0 ? 'pr-btn-primary' : 'pr-btn-outline');
            btn.textContent = label;
            btn.onclick = () => selectJob(jobId, btn);
            tabsContainer.appendChild(btn);
        });
    }

    renderSelectedJob();
}

function selectJob(jobId, btnEl) {
    currentJobId = jobId;
    document.querySelectorAll('#jobTabs button').forEach(b => b.className = 'pr-btn pr-btn-outline');
    btnEl.className = 'pr-btn pr-btn-primary';
    renderSelectedJob();
}

function renderSelectedJob() {
    const container = document.getElementById('stepsList');
    const group = jobGroups[currentJobId];
    if (!group) { container.innerHTML = '<p class="pr-empty">No active jobs.</p>'; return; }

    let html = '';
    group.items.forEach(item => {
        html += '<div class="pr-card">';
        html += '<div class="pr-card-title">' + (item.job ? escapeHtml(item.job.job_no) : 'Job') + (item.job && item.job.customer_name ? ' - ' + escapeHtml(item.job.customer_name) : '') + '</div>';
        html += '<div class="pr-card-sub">' + (item.job ? escapeHtml(item.job.status || '') + ' &middot; ' : '') + (item.order != null ? item.order + '. ' : '') + escapeHtml(item.stepName || '') + '</div>';

        // Overall Incharge only: Actual Start/End + delay reason (fab) or
        // Start/Stop/Remarks (paint, which has no separate planned/delay-
        // reason concept) - permitted by the supervisor-only UPDATE policy.
        // A plain assigned-only inspector never sees these fields at all.
        if (item.isSupervisor && item.type === 'fab') {
            const startDelayed = !!(item.actualStart && item.plannedStart && item.actualStart > item.plannedStart);
            const endDelayed = !!(item.actualEnd && item.plannedEnd && item.actualEnd > item.plannedEnd);
            html += '<div style="display:grid; grid-template-columns:1fr 1fr; gap:8px; margin-top:8px;">';
            html += '<div><label class="pr-label">Actual Start</label><input type="date" class="pr-input" style="' + (startDelayed ? 'border:2px solid #dc3545;' : '') + '" value="' + (item.actualStart || '') + '" onchange="updateFabField(\'' + item.trackingId + '\',\'actual_start\',this.value)"></div>';
            html += '<div><label class="pr-label">Actual End</label><input type="date" class="pr-input" style="' + (endDelayed ? 'border:2px solid #dc3545;' : '') + '" value="' + (item.actualEnd || '') + '" onchange="updateFabField(\'' + item.trackingId + '\',\'actual_end\',this.value)"></div>';
            html += '</div>';
            if (startDelayed) {
                html += '<label class="pr-label" style="margin-top:6px; color:#dc3545;">Start Late Reason</label>';
                html += '<input type="text" class="pr-input" style="border:2px solid #dc3545;" value="' + (item.startDelayReason || '').replace(/"/g, '&quot;') + '" onchange="updateFabField(\'' + item.trackingId + '\',\'start_delay_reason\',this.value)">';
            }
            if (endDelayed) {
                html += '<label class="pr-label" style="margin-top:6px; color:#dc3545;">End Late Reason</label>';
                html += '<input type="text" class="pr-input" style="border:2px solid #dc3545;" value="' + (item.endDelayReason || '').replace(/"/g, '&quot;') + '" onchange="updateFabField(\'' + item.trackingId + '\',\'end_delay_reason\',this.value)">';
            }
        } else if (item.isSupervisor && item.type === 'paint') {
            html += '<div style="display:grid; grid-template-columns:1fr 1fr; gap:8px; margin-top:8px;">';
            html += '<div><label class="pr-label">Start Date</label><input type="date" class="pr-input" value="' + (item.startDate || '') + '" onchange="updatePaintField(\'' + item.trackingId + '\',\'start_date\',this.value)"></div>';
            html += '<div><label class="pr-label">Stop Date</label><input type="date" class="pr-input" value="' + (item.stopDate || '') + '" onchange="updatePaintField(\'' + item.trackingId + '\',\'stop_date\',this.value)"></div>';
            html += '</div>';
            html += '<label class="pr-label" style="margin-top:6px;">Remarks</label>';
            html += '<input type="text" class="pr-input" value="' + (item.remarks || '').replace(/"/g, '&quot;') + '" onchange="updatePaintField(\'' + item.trackingId + '\',\'remarks\',this.value)">';
        }

        html += '<div style="display:flex; flex-wrap:wrap; gap:6px; margin:8px 0 4px;">';
        if (item.links.length === 0) {
            html += '<span style="font-size:12px; color:#999;">No inspection sheet on this step.</span>';
        }
        item.links.forEach(l => {
            html += '<a class="pr-btn pr-btn-outline" style="display:inline-block;" href="inspection-report.html?job=' + item.jobId + '&report=' + l.reportId + '">&#128206; ' + escapeHtml(l.code) + (l.hasFile ? '' : ' (empty)') + '</a>';
        });
        html += '</div>';

        if (item.images.length > 0) {
            html += '<div style="display:flex; flex-wrap:wrap; gap:6px; margin:4px 0;">';
            item.images.forEach(img => {
                const jsPath = img.file_path.replace(/'/g, "\\'");
                html += '<span style="background:#e6edf5; color:#1e3a5f; padding:4px 8px; border-radius:12px; font-size:12px;"><a href="#" onclick="viewProcessImage(\'' + jsPath + '\'); return false;" style="color:#1e3a5f;">&#128247; ' + escapeHtml(img.file_name) + '</a></span>';
            });
            html += '</div>';
        }
        html += '</div>';
    });
    container.innerHTML = html;
}

async function updateFabField(trackingId, field, value) {
    const updateObj = {};
    updateObj[field] = value === '' ? null : value;
    const { error } = await supabaseClient.from('pr_fab_tracking').update(updateObj).eq('id', trackingId);
    if (error) { alert('Error: ' + error.message); return; }
    loadAssignedSteps();
}

async function updatePaintField(trackingId, field, value) {
    const updateObj = {};
    updateObj[field] = value === '' ? null : value;
    const { error } = await supabaseClient.from('pr_paint_tracking').update(updateObj).eq('id', trackingId);
    if (error) { alert('Error: ' + error.message); return; }
    loadAssignedSteps();
}

async function viewProcessImage(path) {
    const { data, error } = await supabaseClient.storage.from('process-images').createSignedUrl(path, 300);
    if (error) { alert('Error: ' + error.message); return; }
    window.open(data.signedUrl, '_blank');
}

function escapeHtml(str) {
    return (str || '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
}

if (session) loadAssignedSteps();

</script>

</body>
</html>
