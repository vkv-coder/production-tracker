<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Production Tracker - Inspection Sheet</title>
<link rel="manifest" href="manifest.json">
<link rel="stylesheet" href="style.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/xlsx-populate@1.21.0/browser/xlsx-populate-no-encryption.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js"></script>
</head>
<body>

<div class="pr-header">
    <h1 id="reportHeader">Inspection Sheet</h1>
    <button class="logout-btn" style="background:#555;" onclick="goBack()">Back</button>
</div>

<div class="pr-container">
    <p id="subHeader" style="font-size:13px; color:#666; margin-top:-8px; margin-bottom:12px;"></p>
    <div id="reportCard"><p class="pr-empty">Loading...</p></div>
</div>

<script src="config.js"></script>
<script>

const session = requireLogin();
const urlParams = new URLSearchParams(window.location.search);
const reportId = urlParams.get('report');
const jobId = urlParams.get('job');

let jobRecord = null;
let report = null;
let format = null;
let gridData = [];
let activeCell = null;

// Advanced engine state (xlsx-populate) — only active when the uploaded file
// parses successfully. currentWorkbook is the live object we mutate on every
// cell edit and finally re-serialize on Save, so every other sheet, style,
// merge and untouched dropdown validation in the original file survives byte-
// for-byte. If the file fails to parse, we fall back to the old single-sheet
// SheetJS flow (usingAdvancedEngine stays false) instead of breaking the page.
let currentWorkbook = null;
let usingAdvancedEngine = false;
let usedFallback = false;
let fallbackReason = '';
let sheetNames = [];
let currentSheetIndex = 0;
let validationMap = null;
let validationDiagnostic = '';

function goBack() {
    window.location.href = (session.role === 'Partner') ? 'partner-home.html' : ('job-detail.html?job=' + jobId);
}

async function init() {
    if (!reportId || !jobId) {
        document.getElementById('reportCard').innerHTML = '<p class="pr-empty">No report specified.</p>';
        return;
    }

    const { data: job } = await supabaseClient.from('pr_jobs').select('job_no').eq('id', jobId).maybeSingle();
    jobRecord = job;

    const { data: rpt } = await supabaseClient.from('pr_inspection_reports').select('*, pr_inspection_formats_master(code, name)').eq('id', reportId).maybeSingle();
    if (!rpt) {
        document.getElementById('reportCard').innerHTML = '<p class="pr-empty">Report not found.</p>';
        return;
    }
    report = rpt;
    format = rpt.pr_inspection_formats_master;

    document.getElementById('reportHeader').textContent = format ? (format.code + ' — ' + format.name) : 'Inspection Sheet';
    document.getElementById('subHeader').textContent = (jobRecord ? jobRecord.job_no : '');

    await loadSheetIntoGrid();
}

function blankGrid() {
    return Array.from({ length: 8 }, () => Array(6).fill(''));
}

// A hung promise never rejects, so a plain try/catch around it shows nothing
// at all if it stalls — race it against a timeout so a stuck read/write
// surfaces as a visible error instead of looking like the button did nothing.
function withTimeout(promise, ms, label) {
    return Promise.race([
        promise,
        new Promise((_, reject) => setTimeout(() => reject(new Error(label + ' timed out after ' + (ms / 1000) + 's')), ms))
    ]);
}

async function loadSheetIntoGrid() {
    const container = document.getElementById('reportCard');
    container.innerHTML = '<p class="pr-empty">Loading sheet...</p>';

    currentWorkbook = null;
    usingAdvancedEngine = false;
    usedFallback = false;
    fallbackReason = '';
    validationDiagnostic = '';
    sheetNames = [];
    currentSheetIndex = 0;
    validationMap = null;
    mergeAnchors = {};
    mergeCovered = new Set();
    colWidths = [];
    rowHeights = [];
    rawValidationsBySheet = {};

    if (report.file_path) {
        const { data: blob, error } = await supabaseClient.storage.from('inspection-sheets').download(report.file_path);
        if (error) {
            container.innerHTML = '<p class="pr-empty">⚠️ Could not load sheet file: ' + escapeHtml(error.message) + '</p>';
            return;
        }
        try {
            currentWorkbook = await withTimeout(XlsxPopulate.fromDataAsync(blob), 20000, 'Reading file');
            sheetNames = currentWorkbook.sheets().map(s => s.name());
            usingAdvancedEngine = true;
            await extractValidationsFromXlsx(blob);
            loadSheetFromWorkbook(0);
            return;
        } catch (e) {
            usedFallback = true;
            fallbackReason = e && e.message ? e.message : String(e);
            try {
                const arrayBuffer = await blob.arrayBuffer();
                const wb = XLSX.read(arrayBuffer, { type: 'array' });
                const ws = wb.Sheets[wb.SheetNames[0]];
                gridData = XLSX.utils.sheet_to_json(ws, { header: 1, defval: '' }).map(row => row.map(c => String(c)));
                if (gridData.length === 0) gridData = blankGrid();
            } catch (e2) {
                container.innerHTML = '<p class="pr-empty">⚠️ Could not read this file as a spreadsheet (' + escapeHtml(e2.message) + '). Download it below instead.</p>' +
                    '<button class="pr-btn pr-btn-primary" style="margin-top:8px;" onclick="downloadSheet()">Download</button>';
                return;
            }
        }
    } else {
        gridData = blankGrid();
    }
    renderGrid();
}

// Reads one sheet out of the live workbook (values + per-cell dropdown-list
// validations) into the on-screen grid. Called on initial load and whenever a
// sheet tab is clicked — never re-fetches, since currentWorkbook already
// holds any edits made on other sheets in this session.
function loadSheetFromWorkbook(sheetIndex) {
    currentSheetIndex = sheetIndex;
    const sheet = currentWorkbook.sheet(sheetIndex);
    const used = sheet.usedRange();

    if (!used) {
        gridData = blankGrid();
        validationMap = gridData.map(row => row.map(() => null));
        mergeAnchors = {};
        mergeCovered = new Set();
        colWidths = [];
        rowHeights = [];
        renderGrid();
        return;
    }

    const rawValues = used.value();
    gridData = rawValues.map(row => (Array.isArray(row) ? row : [row]).map(c => (c === null || c === undefined) ? '' : String(c)));
    if (gridData.length === 0) gridData = blankGrid();

    const mergeDiagnostic = buildMergeMaps(sheet, used);
    buildColumnWidths(sheet, used);
    buildRowHeights(sheet, used);

    const startCell = used.startCell();
    const startRow = startCell.rowNumber();
    const startCol = startCell.columnNumber();
    const rawEntries = rawValidationsBySheet[sheet.name()] || [];

    let dropdownCellCount = 0;
    validationMap = gridData.map((row, r) => row.map((cellVal, c) => {
        // Only ever skip a cell as "merge covered" if it's genuinely blank —
        // never let a possibly-wrong merge parse hide real content/a dropdown.
        if (mergeCovered.has(r + ',' + c) && cellVal === '') return null;
        const absRow = startRow + r, absCol = startCol + c;
        const match = rawEntries.find(entry => isAddressInSqref(absRow, absCol, entry.sqref));
        if (!match) return null;
        const opts = resolveListOptions(match.formula1, sheet);
        if (opts) dropdownCellCount++;
        return opts;
    }));
    const dimNote = gridData.length + ' rows x ' + (gridData[0] ? gridData[0].length : 0) + ' cols detected';
    validationDiagnostic = (rawEntries.length === 0 ? 'no list validations found in raw XML for this sheet' : (rawEntries.length + ' list validation rule(s) in XML, ' + dropdownCellCount + ' cell(s) matched'))
        + ' | ' + dimNote + ' | ' + mergeDiagnostic;

    renderGrid();
}

// cell.dataValidation() from the library repeatedly failed to detect a real,
// confirmed dropdown-list column, so read validations straight from the raw
// worksheet XML instead (the ground truth OOXML format) rather than trust
// that API further. rawValidationsBySheet[sheetName] is built once per file
// load by extractValidationsFromXlsx, as a list of { sqref, formula1 } pulled
// directly from each sheet's <dataValidation type="list"> nodes.
let rawValidationsBySheet = {};

function isAddressInSqref(absRow, absCol, sqref) {
    return sqref.split(/\s+/).some(part => {
        const bits = part.split(':');
        const start = parseCellRef(bits[0]);
        if (!start) return false;
        const end = bits[1] ? parseCellRef(bits[1]) : start;
        if (!end) return false;
        const minRow = Math.min(start.row, end.row), maxRow = Math.max(start.row, end.row);
        const minCol = Math.min(start.col, end.col), maxCol = Math.max(start.col, end.col);
        return absRow >= minRow && absRow <= maxRow && absCol >= minCol && absCol <= maxCol;
    });
}

async function extractValidationsFromXlsx(blob) {
    rawValidationsBySheet = {};
    try {
        const zip = await JSZip.loadAsync(blob);
        const parser = new DOMParser();

        const workbookXmlFile = zip.file('xl/workbook.xml');
        if (!workbookXmlFile) return;
        const workbookDoc = parser.parseFromString(await workbookXmlFile.async('string'), 'application/xml');
        const sheetNodes = Array.from(workbookDoc.getElementsByTagName('sheet'));

        const relsMap = {};
        const relsFile = zip.file('xl/_rels/workbook.xml.rels');
        if (relsFile) {
            const relsDoc = parser.parseFromString(await relsFile.async('string'), 'application/xml');
            Array.from(relsDoc.getElementsByTagName('Relationship')).forEach(rel => {
                relsMap[rel.getAttribute('Id')] = rel.getAttribute('Target');
            });
        }

        for (const sheetNode of sheetNodes) {
            const name = sheetNode.getAttribute('name');
            const rId = sheetNode.getAttribute('r:id') || sheetNode.getAttribute('id');
            const target = relsMap[rId];
            if (!name || !target) continue;
            const sheetFile = zip.file('xl/' + target);
            if (!sheetFile) continue;
            const sheetDoc = parser.parseFromString(await sheetFile.async('string'), 'application/xml');
            const entries = [];
            Array.from(sheetDoc.getElementsByTagName('dataValidation')).forEach(dv => {
                if (dv.getAttribute('type') !== 'list') return;
                const sqref = dv.getAttribute('sqref');
                const f1Node = dv.getElementsByTagName('formula1')[0];
                const formula1 = f1Node ? f1Node.textContent : null;
                if (sqref && formula1) entries.push({ sqref, formula1 });
            });
            rawValidationsBySheet[name] = entries;
        }
    } catch (e) {
        rawValidationsBySheet = {};
    }
}

// Merged header/label cells in the original file (e.g. a 2-column-wide "Total
// OK" header) were being unmerged into a content cell plus a blank "ghost"
// column next to it — the reported "extra column against every column".
// sheet._mergeCells isn't part of the documented public API, but it's the
// only way to read merge ranges (the library exposes no public getter for
// them), keyed by address string like "C3:D3". Parse those into relative
// (row,col) coordinates matching gridData/validationMap, so rendering can
// collapse each merge back into one spanning <td> instead of N separate ones.
let mergeAnchors = {};
let mergeCovered = new Set();
let colWidths = [];

// The reported "extra blank column after every column" most likely isn't a
// merge at all — real narrow spacer columns in the original file (near-
// invisible in Excel because they're only a few px wide) become full-size
// ~130px blank columns here because rendering never accounted for each
// column's actual width. Read each used column's real width and scale our
// <td>/textarea/select width to match, so a genuinely narrow column stays
// narrow instead of ballooning into something that looks like an extra field.
function buildColumnWidths(sheet, used) {
    colWidths = [];
    try {
        const startCell = used.startCell();
        const startCol = startCell.columnNumber();
        const numCols = gridData[0] ? gridData[0].length : 0;
        for (let c = 0; c < numCols; c++) {
            let col = null;
            try { col = sheet.column(startCol + c); } catch (e) { col = null; }
            const hidden = (col && typeof col.hidden === 'function') ? col.hidden() : false;
            const w = (col && typeof col.width === 'function') ? col.width() : undefined;
            const units = (typeof w === 'number') ? w : 9.140625;
            let px = hidden ? 6 : Math.round(units * 7 + 5);
            if (px < 10) px = 10;
            if (px > 400) px = 400;
            colWidths.push(px);
        }
    } catch (e) {
        colWidths = [];
    }
}

let rowHeights = [];

// Same fix as buildColumnWidths, but for rows — genuinely short spacer rows
// in the original file were rendering as full-height blank grey rows because
// nothing accounted for each row's actual height (Excel row heights are in
// points; ~15pt is Excel's own default for an unset row).
function buildRowHeights(sheet, used) {
    rowHeights = [];
    try {
        const startCell = used.startCell();
        const startRow = startCell.rowNumber();
        const numRows = gridData.length;
        for (let r = 0; r < numRows; r++) {
            let row = null;
            try { row = sheet.row(startRow + r); } catch (e) { row = null; }
            const hidden = (row && typeof row.hidden === 'function') ? row.hidden() : false;
            const h = (row && typeof row.height === 'function') ? row.height() : undefined;
            const pts = (typeof h === 'number') ? h : 15;
            let px = hidden ? 6 : Math.round(pts * 1.333);
            if (px < 10) px = 10;
            if (px > 300) px = 300;
            rowHeights.push(px);
        }
    } catch (e) {
        rowHeights = [];
    }
}

function parseCellRef(ref) {
    const m = ref.match(/^\$?([A-Z]+)\$?(\d+)$/i);
    if (!m) return null;
    let col = 0;
    const letters = m[1].toUpperCase();
    for (let i = 0; i < letters.length; i++) col = col * 26 + (letters.charCodeAt(i) - 64);
    return { row: parseInt(m[2], 10), col: col };
}

function buildMergeMaps(sheet, used) {
    mergeAnchors = {};
    mergeCovered = new Set();
    try {
        const mergeKeys = (sheet._mergeCells && Object.keys(sheet._mergeCells)) || [];
        if (mergeKeys.length === 0) return 'no merges found (_mergeCells empty/missing)';

        const startCell = used.startCell();
        const startRow = startCell.rowNumber();
        const startCol = startCell.columnNumber();

        let applied = 0;
        mergeKeys.forEach(ref => {
            const parts = ref.split(':');
            if (parts.length !== 2) return;
            const start = parseCellRef(parts[0]);
            const end = parseCellRef(parts[1]);
            if (!start || !end) return;
            const r0 = start.row - startRow, c0 = start.col - startCol;
            const r1 = end.row - startRow, c1 = end.col - startCol;
            if (r0 < 0 || c0 < 0) return;
            mergeAnchors[r0 + ',' + c0] = { rowSpan: r1 - r0 + 1, colSpan: c1 - c0 + 1 };
            applied++;
            for (let rr = r0; rr <= r1; rr++) {
                for (let cc = c0; cc <= c1; cc++) {
                    if (rr === r0 && cc === c0) continue;
                    mergeCovered.add(rr + ',' + cc);
                }
            }
        });
        return mergeKeys.length + ' merge(s) found (' + mergeKeys.slice(0, 3).join(', ') + '), ' + applied + ' applied';
    } catch (e) {
        return 'merge read failed: ' + (e && e.message ? e.message : e);
    }
}

// A cell's dataValidation() formula1 is either a literal quoted list
// ("Yes,No,NA") or a cell range reference (optionally "OtherSheet!A1:A5").
// Resolve either form into a plain array of option strings, or null if it
// can't be parsed — cells fall back to a normal wrapped text box in that case.
function resolveListOptions(formula1, sheet) {
    if (!formula1) return null;
    const trimmed = String(formula1).trim();
    if (trimmed.startsWith('"') && trimmed.endsWith('"')) {
        return trimmed.slice(1, -1).split(',').map(s => s.trim()).filter(s => s !== '');
    }
    try {
        let sheetName = sheet.name();
        let rangeRef = trimmed;
        const bangIdx = trimmed.indexOf('!');
        if (bangIdx !== -1) {
            sheetName = trimmed.slice(0, bangIdx).replace(/^'|'$/g, '');
            rangeRef = trimmed.slice(bangIdx + 1);
        }
        rangeRef = rangeRef.replace(/\$/g, '');
        const refSheet = currentWorkbook.sheet(sheetName);
        if (!refSheet) return null;
        const vals = refSheet.range(rangeRef).value();
        const flat = [].concat(...vals).filter(v => v !== null && v !== undefined && v !== '');
        return flat.length ? flat.map(String) : null;
    } catch (e) {
        return null;
    }
}

function switchSheet(idx) {
    if (idx === currentSheetIndex) return;
    loadSheetFromWorkbook(idx);
}

function normalizeGrid() {
    const maxCols = gridData.reduce((max, row) => Math.max(max, row.length), 1);
    gridData.forEach(row => {
        while (row.length < maxCols) row.push('');
    });
}

function autoGrowCell(el) {
    el.style.height = 'auto';
    el.style.height = el.scrollHeight + 'px';
}

function renderGrid() {
    normalizeGrid();
    const container = document.getElementById('reportCard');
    let html = '';

    if (report.uploaded_at) {
        html += '<p style="font-size:12px; color:#666; margin:0 0 8px;">Last saved by ' + escapeHtml(report.uploaded_by || '-') + ' on ' + new Date(report.uploaded_at).toLocaleString() + '</p>';
    }
    if (usedFallback) {
        html += '<p style="font-size:12px; color:#b8860b; margin:0 0 8px;">⚠️ Advanced view (multiple sheets/dropdowns) isn\'t available for this file — editing in simple mode. (' + escapeHtml(fallbackReason) + ')</p>';
    } else if (usingAdvancedEngine && validationDiagnostic) {
        html += '<p style="font-size:11px; color:#888; margin:0 0 8px;">' + escapeHtml(validationDiagnostic) + '</p>';
    }

    if (usingAdvancedEngine && sheetNames.length > 1) {
        html += '<div style="display:flex; gap:6px; flex-wrap:wrap; margin-bottom:10px;">';
        sheetNames.forEach((name, idx) => {
            html += '<button class="pr-btn ' + (idx === currentSheetIndex ? 'pr-btn-primary' : 'pr-btn-outline') + '" onclick="switchSheet(' + idx + ')">' + escapeHtml(name) + '</button>';
        });
        html += '</div>';
    }

    html += '<div style="display:flex; gap:8px; flex-wrap:wrap; margin-bottom:10px;">';
    html += '<button class="pr-btn pr-btn-primary" id="saveSheetBtn" onclick="saveSheetGrid()">Save</button>';
    if (!usingAdvancedEngine) {
        html += '<button class="pr-btn pr-btn-outline" onclick="addRow()">+ Row Above Cursor</button>';
        html += '<button class="pr-btn pr-btn-outline" onclick="addColumn()">+ Column Before Cursor</button>';
    }
    if (report.file_path) {
        html += '<button class="pr-btn pr-btn-outline" onclick="downloadSheet()">Download Copy</button>';
    }
    html += '</div>';

    html += '<div style="overflow-x:auto; border:1px solid #888; border-radius:6px;">';
    html += '<table style="border-collapse:collapse; width:100%;">';
    gridData.forEach((row, r) => {
        html += '<tr>';
        row.forEach((cell, c) => {
            if (mergeCovered.has(r + ',' + c) && cell === '') return;
            const span = mergeAnchors[r + ',' + c];
            const spanAttrs = span ? (' rowspan="' + span.rowSpan + '" colspan="' + span.colSpan + '"') : '';
            let cellWidth = colWidths[c] || 130;
            if (span) { for (let k = 1; k < span.colSpan; k++) cellWidth += (colWidths[c + k] || 130); }
            let cellHeight = rowHeights[r] || 24;
            if (span) { for (let k = 1; k < span.rowSpan; k++) cellHeight += (rowHeights[r + k] || 24); }
            const options = (validationMap && validationMap[r] && validationMap[r][c]) || null;
            // Dropdown cells are the form's designated inspector-input fields
            // (OK/NOT OK etc.) — highlight them while still blank so it's
            // obvious at a glance what still needs filling in.
            const needsInput = !!options && cell === '';
            const inputStyle = needsInput ? ' background:#fff3b0;' : '';
            const cellId = 'cell_' + r + '_' + c;
            // Padding alone adds ~12px to any control's rendered height, so a
            // genuinely short spacer row still needs tight padding or it'll
            // look thick regardless of the height we ask for.
            const vPad = cellHeight < 20 ? 1 : 6;
            html += '<td' + spanAttrs + ' style="padding:0; border:1px solid #888; vertical-align:top;">';
            if (options) {
                html += '<select id="' + cellId + '" onchange="updateCell(' + r + ',' + c + ',this.value)" onfocus="setActiveCell(' + r + ',' + c + ')" onkeydown="handleCellKeydown(event,' + r + ',' + c + ')" style="border:none; padding:' + vPad + 'px 8px; font-size:13px; width:' + cellWidth + 'px; min-width:' + cellWidth + 'px; height:' + cellHeight + 'px; min-height:' + cellHeight + 'px;' + inputStyle + '">';
                html += '<option value=""' + (cell === '' ? ' selected' : '') + '></option>';
                options.forEach(opt => {
                    html += '<option value="' + escapeHtml(opt) + '"' + (cell === opt ? ' selected' : '') + '>' + escapeHtml(opt) + '</option>';
                });
                html += '</select>';
            } else {
                html += '<textarea id="' + cellId + '" rows="1" onchange="updateCell(' + r + ',' + c + ',this.value)" onfocus="setActiveCell(' + r + ',' + c + ')" onkeydown="handleCellKeydown(event,' + r + ',' + c + ')" oninput="autoGrowCell(this)" style="border:none; padding:' + vPad + 'px 8px; font-size:13px; width:' + cellWidth + 'px; min-width:' + cellWidth + 'px; height:' + cellHeight + 'px; min-height:' + cellHeight + 'px; white-space:pre-wrap; overflow-wrap:break-word; resize:none; overflow:hidden; font-family:inherit; display:block;' + inputStyle + '">' + escapeHtml(cell) + '</textarea>';
            }
            html += '</td>';
        });
        html += '</tr>';
    });
    html += '</table></div>';

    container.innerHTML = html;
    container.querySelectorAll('textarea').forEach(autoGrowCell);
}

function updateCell(r, c, value) {
    gridData[r][c] = value;
    if (usingAdvancedEngine && currentWorkbook) {
        try {
            currentWorkbook.sheet(currentSheetIndex).cell(r + 1, c + 1).value(value);
        } catch (e) {
            alert('Could not record this edit into the file: ' + (e && e.message ? e.message : e));
        }
    }
    // Drop the "needs input" highlight the moment a dropdown is filled, without
    // waiting for a full re-render.
    const el = document.getElementById('cell_' + r + '_' + c);
    if (el && el.tagName === 'SELECT') {
        el.style.background = value === '' ? '#fff3b0' : '';
    }
}

function setActiveCell(r, c) {
    activeCell = { r: r, c: c };
}

function focusCell(r, c) {
    const el = document.getElementById('cell_' + r + '_' + c);
    if (el) {
        el.focus();
        if (el.tagName === 'TEXTAREA' && el.select) { try { el.select(); } catch (e) {} }
    }
}

// Arrow keys jump between cells like a real spreadsheet instead of just
// moving the text cursor within one field — skips over merge-covered
// positions (which have no rendered element) in the direction of travel.
function handleCellKeydown(e, r, c) {
    let dr = 0, dc = 0;
    if (e.key === 'ArrowUp') dr = -1;
    else if (e.key === 'ArrowDown') dr = 1;
    else if (e.key === 'ArrowLeft') dc = -1;
    else if (e.key === 'ArrowRight') dc = 1;
    else return;
    e.preventDefault();
    const maxRows = gridData.length, maxCols = gridData[0] ? gridData[0].length : 0;
    let nr = r + dr, nc = c + dc;
    while (nr >= 0 && nr < maxRows && nc >= 0 && nc < maxCols) {
        if (document.getElementById('cell_' + nr + '_' + nc)) { focusCell(nr, nc); return; }
        nr += dr; nc += dc;
    }
}

function addRow() {
    const cols = gridData.reduce((max, row) => Math.max(max, row.length), 6);
    const insertAt = activeCell ? Math.min(activeCell.r, gridData.length) : gridData.length;
    gridData.splice(insertAt, 0, Array(cols).fill(''));
    renderGrid();
}

function addColumn() {
    const insertAt = activeCell ? activeCell.c : (gridData[0] ? gridData[0].length : 0);
    gridData.forEach(row => row.splice(insertAt, 0, ''));
    renderGrid();
}

async function saveSheetGrid() {
    const btn = document.getElementById('saveSheetBtn');
    const resetBtn = () => { if (btn) { btn.disabled = false; btn.textContent = 'Save'; } };
    if (btn) { btn.disabled = true; btn.textContent = 'Saving...'; }

    let blob;
    try {
        if (usingAdvancedEngine && currentWorkbook) {
            blob = await withTimeout(currentWorkbook.outputAsync(), 20000, 'Preparing file');
        } else {
            const ws = XLSX.utils.aoa_to_sheet(gridData);
            const wb = XLSX.utils.book_new();
            XLSX.utils.book_append_sheet(wb, ws, 'Sheet1');
            const wbout = XLSX.write(wb, { type: 'array', bookType: 'xlsx' });
            blob = new Blob([wbout], { type: 'application/octet-stream' });
        }
    } catch (e) {
        alert('Error preparing file to save: ' + (e && e.message ? e.message : e));
        resetBtn();
        return;
    }

    const fileName = (report.file_name && report.file_name.trim()) || ((format ? format.code : 'sheet') + '.xlsx');
    const path = session.companyId + '/' + report.id + '/' + fileName;

    const { error: uploadError } = await supabaseClient.storage.from('inspection-sheets').upload(path, blob, { upsert: true });
    if (uploadError) { alert('Error saving: ' + uploadError.message); resetBtn(); return; }

    const { data: updated, error } = await supabaseClient
        .from('pr_inspection_reports')
        .update({ file_path: path, file_name: fileName, uploaded_by: session.name, uploaded_at: new Date().toISOString() })
        .eq('id', report.id)
        .select('*')
        .single();
    if (error) { alert('Error saving: ' + error.message); resetBtn(); return; }

    report = updated;
    renderGrid();
}

async function downloadSheet() {
    if (!report.file_path) return;
    const { data, error } = await supabaseClient.storage.from('inspection-sheets').createSignedUrl(report.file_path, 300);
    if (error) { alert('Error: ' + error.message); return; }
    window.open(data.signedUrl, '_blank');
}

function escapeHtml(str) {
    return (str || '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
}

if (session) init();

</script>
