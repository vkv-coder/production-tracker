<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Production Tracker - New Job</title>
<link rel="manifest" href="manifest.json">
<link rel="stylesheet" href="style.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>

<div class="pr-header">
    <h1>New Job</h1>
    <button class="logout-btn" style="background:#555;" onclick="window.location.href='home.html'">Back</button>
</div>

<div class="pr-container">

    <label class="pr-label">Job No.</label>
    <input type="text" id="jobNoInput" class="pr-input" placeholder="e.g. MK/WO/002/2026">

    <label class="pr-label">Customer Name</label>
    <input type="text" id="customerInput" class="pr-input" placeholder="Customer name">

    <label class="pr-label">Unit</label>
    <select id="unitSelect" class="pr-select">
        <option value="">-- Select Unit --</option>
    </select>

    <label class="pr-label">Description / Qty</label>
    <textarea id="descInput" class="pr-input" rows="3" placeholder="Job description or quantity"></textarea>

    <button class="pr-btn pr-btn-primary" style="width:100%; padding:12px; font-size:15px; margin-top:10px;" onclick="createJob()">Create Job</button>

    <p id="errorMsg" style="color:#d9534f; font-size:13px; text-align:center; margin-top:12px; display:none;"></p>
    <p id="successMsg" style="color:#2e7d32; font-size:13px; text-align:center; margin-top:12px; display:none;"></p>

</div>

<script src="config.js"></script>
<script>

const session = requireLogin();

async function loadUnits() {
    const { data } = await supabaseClient.from('pr_units').select('id, unit_name').eq('company_id', session.companyId).eq('is_active', true);
    const sel = document.getElementById('unitSelect');
    (data || []).forEach(u => {
        const opt = document.createElement('option');
        opt.value = u.id;
        opt.textContent = u.unit_name;
        sel.appendChild(opt);
    });
}

async function attachTemplateToReport(jobId, formatId, sourceCol, trackingId, templateInfo) {
    const insertObj = { company_id: session.companyId, job_id: jobId, format_id: formatId };
    insertObj[sourceCol] = trackingId;
    const { data: report, error } = await supabaseClient.from('pr_inspection_reports').insert(insertObj).select('id').single();
    if (error || !report) { console.error('Inspection sheet auto-attach: could not create report row', error); return false; }

    const destPath = session.companyId + '/' + report.id + '/' + templateInfo.template_file_name;
    const { error: copyError } = await supabaseClient.storage.from('inspection-sheets').copy(templateInfo.template_file_path, destPath);
    if (copyError) { console.error('Inspection sheet auto-attach: could not copy template file', copyError, 'from:', templateInfo.template_file_path, 'to:', destPath); return false; }

    const { error: updateError } = await supabaseClient.from('pr_inspection_reports').update({
        file_path: destPath,
        file_name: templateInfo.template_file_name,
        uploaded_by: 'Template (auto-attached)',
        uploaded_at: new Date().toISOString()
    }).eq('id', report.id);
    if (updateError) { console.error('Inspection sheet auto-attach: could not update report row', updateError); return false; }
    return true;
}

async function createJob() {
    const errorMsg = document.getElementById('errorMsg');
    const successMsg = document.getElementById('successMsg');
    errorMsg.style.display = 'none';
    successMsg.style.display = 'none';

    const jobNo = document.getElementById('jobNoInput').value.trim();
    const customer = document.getElementById('customerInput').value.trim();
    const unitId = document.getElementById('unitSelect').value;
    const desc = document.getElementById('descInput').value.trim();

    if (!jobNo) {
        errorMsg.textContent = 'Job No. is required';
        errorMsg.style.display = 'block';
        return;
    }

    // 1. Create the job
    const { data: jobData, error: jobError } = await supabaseClient
        .from('pr_jobs')
        .insert({
            company_id: session.companyId,
            job_no: jobNo,
            customer_name: customer || null,
            unit_id: unitId || null,
            description: desc || null,
            status: 'Running'
        })
        .select('id')
        .single();

    if (jobError || !jobData) {
        errorMsg.textContent = 'Error creating job: ' + (jobError ? jobError.message : 'unknown');
        errorMsg.style.display = 'block';
        return;
    }

    const jobId = jobData.id;
    let templateAttachFailures = 0;
    const warnings = [];

    // 2. Create blank Fab tracking rows for every Fab step in this company's master
    const { data: fabSteps } = await supabaseClient
        .from('pr_fab_steps_master')
        .select('id, inspection_format_id, pr_inspection_formats_master(template_file_path, template_file_name)')
        .eq('company_id', session.companyId)
        .eq('is_active', true);

    if (fabSteps && fabSteps.length > 0) {
        const fabRows = fabSteps.map(s => ({
            job_id: jobId,
            fab_step_id: s.id,
            inspection_status: 'Pending'
        }));
        const { data: insertedFab, error: fabInsertError } = await supabaseClient.from('pr_fab_tracking').insert(fabRows).select('id, fab_step_id');
        if (fabInsertError) warnings.push('Fabrication steps: ' + fabInsertError.message);
        if (insertedFab) {
            const stepMap = {};
            fabSteps.forEach(s => { stepMap[s.id] = s; });
            for (const row of insertedFab) {
                const step = stepMap[row.fab_step_id];
                if (step && step.inspection_format_id && step.pr_inspection_formats_master?.template_file_path) {
                    const ok = await attachTemplateToReport(jobId, step.inspection_format_id, 'fab_tracking_id', row.id, step.pr_inspection_formats_master);
                    if (!ok) templateAttachFailures++;
                }
            }
        }
    }

    // 3. Create blank Paint tracking rows for every process, under every paint item
    const { data: paintProcesses } = await supabaseClient
        .from('pr_paint_process_master')
        .select('id, paint_item_id, inspection_format_id, pr_inspection_formats_master(template_file_path, template_file_name)')
        .eq('company_id', session.companyId)
        .eq('is_active', true);

    if (paintProcesses && paintProcesses.length > 0) {
        const paintRows = paintProcesses.map(p => ({
            job_id: jobId,
            paint_item_id: p.paint_item_id,
            process_id: p.id
        }));
        const { data: insertedPaint, error: paintInsertError } = await supabaseClient.from('pr_paint_tracking').insert(paintRows).select('id, process_id');
        if (paintInsertError) warnings.push('Painting processes: ' + paintInsertError.message);
        if (insertedPaint) {
            const processMap = {};
            paintProcesses.forEach(p => { processMap[p.id] = p; });
            for (const row of insertedPaint) {
                const proc = processMap[row.process_id];
                if (proc && proc.inspection_format_id && proc.pr_inspection_formats_master?.template_file_path) {
                    const ok = await attachTemplateToReport(jobId, proc.inspection_format_id, 'paint_tracking_id', row.id, proc.pr_inspection_formats_master);
                    if (!ok) templateAttachFailures++;
                }
            }
        }
    }

    if (templateAttachFailures > 0) warnings.push(templateAttachFailures + ' inspection sheet(s) could not be auto-attached (see console for details).');

    if (warnings.length > 0) {
        errorMsg.innerHTML = 'Job created, but with warnings:<br>' + warnings.map(w => escapeHtmlLocal(w)).join('<br>');
        errorMsg.style.display = 'block';
        successMsg.innerHTML = '<button class="pr-btn pr-btn-primary" onclick="window.location.href=\'job-detail.html?job=' + jobId + '\'">Continue to Job</button>';
        successMsg.style.display = 'block';
        return;
    }

    successMsg.textContent = 'Job created! Redirecting...';
    successMsg.style.display = 'block';

    setTimeout(() => {
        window.location.href = 'job-detail.html?job=' + jobId;
    }, 1200);
}

function escapeHtmlLocal(str) {
    return (str || '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
}

if (session) loadUnits();

</script>

</body>
</html>
