<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Production Tracker - Job Detail</title>
<link rel="manifest" href="manifest.json">
<link rel="stylesheet" href="style.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>

<div class="pr-header">
    <h1 id="jobNoHeader">Job Detail</h1>
    <div style="display:flex; align-items:center; gap:10px;">
        <button class="logout-btn" style="background:#28a745;" onclick="toggleJobEdit()">Edit</button>
        <button class="logout-btn" style="background:#555;" onclick="window.location.href='home.html'">Back</button>
    </div>
</div>

<div class="pr-container">
    <div id="jobEditPanel" class="pr-card" style="display:none; margin-bottom:12px;">
        <label class="pr-label">Job No.</label>
        <input type="text" id="jobEditNo" class="pr-input">
        <label class="pr-label">Customer</label>
        <input type="text" id="jobEditCust" class="pr-input">
        <label class="pr-label">Unit</label>
        <select id="jobEditUnit" class="pr-select"><option value="">-- None --</option></select>
        <label class="pr-label">Description / Qty</label>
        <textarea id="jobEditDesc" class="pr-input" rows="2"></textarea>
        <div style="display:flex; gap:8px; margin-top:8px;">
            <button class="pr-btn pr-btn-primary" onclick="saveJobEdit()">Save</button>
            <button class="pr-btn pr-btn-outline" onclick="toggleJobEdit()">Cancel</button>
        </div>
    </div>
</div>

<div class="pr-tabs">
    <div class="pr-tab active" data-tab="fab" onclick="switchTab('fab')">Fabrication</div>
    <div class="pr-tab" data-tab="paint" onclick="switchTab('paint')">Painting</div>
</div>

<div class="pr-container">

    <div id="tab-fab" class="tab-content">
        <div id="fabTable"><p class="pr-empty">Loading...</p></div>
    </div>

    <div id="tab-paint" class="tab-content" style="display:none;">
        <div id="paintItemTabs" style="display:flex; gap:8px; margin-bottom:12px;"></div>
        <div id="paintTable"><p class="pr-empty">Loading...</p></div>
    </div>

</div>

<script src="config.js"></script>
<script>

const session = requireLogin();
if (session && session.role === 'Partner') {
    window.location.href = 'partner-home.html';
}
const urlParams = new URLSearchParams(window.location.search);
const jobId = urlParams.get('job');

let inspectorsList = [];
let workersList = [];
let paintItems = [];
let currentPaintItemId = null;

if (!jobId) {
    document.body.innerHTML = '<p class="pr-empty">No job specified.</p>';
}

async function init() {
    await loadJobHeader();

    const { data: insp } = await supabaseClient.from('pr_inspectors').select('id, inspector_name').eq('company_id', session.companyId).eq('is_active', true);
    inspectorsList = insp || [];

    const { data: wrk } = await supabaseClient.from('pr_workers').select('id, worker_name, category').eq('company_id', session.companyId).eq('is_active', true);
    workersList = wrk || [];

    const { data: items } = await supabaseClient.from('pr_paint_items_master').select('id, item_name').eq('company_id', session.companyId).eq('is_active', true);
    paintItems = items || [];

    loadFabTable();
}

let currentJob = null;

async function loadJobHeader() {
    const { data: job } = await supabaseClient.from('pr_jobs').select('job_no, customer_name, unit_id, description, pr_units(unit_name)').eq('id', jobId).maybeSingle();
    if (job) {
        currentJob = job;
        let headerText = job.job_no;
        if (job.pr_units) headerText += ' [' + job.pr_units.unit_name + ']';
        if (job.customer_name) headerText += ' - ' + job.customer_name;
        document.getElementById('jobNoHeader').textContent = headerText;
    }
}

async function toggleJobEdit() {
    const panel = document.getElementById('jobEditPanel');
    if (panel.style.display === 'none') {
        document.getElementById('jobEditNo').value = currentJob ? currentJob.job_no : '';
        document.getElementById('jobEditCust').value = currentJob ? (currentJob.customer_name || '') : '';
        document.getElementById('jobEditDesc').value = currentJob ? (currentJob.description || '') : '';

        const unitSel = document.getElementById('jobEditUnit');
        unitSel.innerHTML = '<option value="">-- None --</option>';
        const { data: units } = await supabaseClient.from('pr_units').select('id, unit_name').eq('company_id', session.companyId).eq('is_active', true).order('unit_name');
        (units || []).forEach(u => {
            const opt = document.createElement('option');
            opt.value = u.id;
            opt.textContent = u.unit_name;
            if (currentJob && currentJob.unit_id === u.id) opt.selected = true;
            unitSel.appendChild(opt);
        });

        panel.style.display = 'block';
    } else {
        panel.style.display = 'none';
    }
}

async function saveJobEdit() {
    const jobNo = document.getElementById('jobEditNo').value.trim();
    const customer = document.getElementById('jobEditCust').value.trim();
    const unitId = document.getElementById('jobEditUnit').value;
    const desc = document.getElementById('jobEditDesc').value.trim();
    if (!jobNo) { alert('Job No. is required'); return; }
    const { error } = await supabaseClient.from('pr_jobs').update({ job_no: jobNo, customer_name: customer || null, unit_id: unitId || null, description: desc || null }).eq('id', jobId);
    if (error) { alert('Error: ' + error.message); return; }
    document.getElementById('jobEditPanel').style.display = 'none';
    loadJobHeader();
}

function switchTab(tab) {
    document.querySelectorAll('.tab-content').forEach(el => el.style.display = 'none');
    document.querySelectorAll('.pr-tab').forEach(el => el.classList.remove('active'));
    document.getElementById('tab-' + tab).style.display = 'block';
    document.querySelector('.pr-tab[data-tab="' + tab + '"]').classList.add('active');
    if (tab === 'paint') loadPaintTabs();
}

// ============ FABRICATION ============
async function loadFabTable() {
    const container = document.getElementById('fabTable');
    container.innerHTML = '<p class="pr-empty">Loading...</p>';

    const { data } = await supabaseClient
        .from('pr_fab_tracking')
        .select('id, planned_start, planned_end, actual_start, actual_end, inspection_status, inspection_date, start_delay_reason, end_delay_reason, pr_fab_steps_master(step_name, step_order, inspection_format_id, pr_inspection_formats_master(code))')
        .eq('job_id', jobId);

    if (!data || data.length === 0) {
        container.innerHTML = '<p class="pr-empty">No fabrication steps found for this job.</p>';
        return;
    }

    data.sort((a, b) => (a.pr_fab_steps_master?.step_order || 0) - (b.pr_fab_steps_master?.step_order || 0));

    const trackingIds = data.map(r => r.id);
    const { data: assignments } = await supabaseClient
        .from('pr_fab_tracking_workers')
        .select('fab_tracking_id, worker_id')
        .in('fab_tracking_id', trackingIds);

    const { data: reports } = await supabaseClient
        .from('pr_inspection_reports')
        .select('fab_tracking_id')
        .in('fab_tracking_id', trackingIds);
    const reportExistsSet = new Set((reports || []).map(r => r.fab_tracking_id));

    const assignedMap = {};
    (assignments || []).forEach(a => {
        if (!assignedMap[a.fab_tracking_id]) assignedMap[a.fab_tracking_id] = new Set();
        assignedMap[a.fab_tracking_id].add(a.worker_id);
    });

    const { data: inspAssignments } = await supabaseClient
        .from('pr_fab_tracking_inspectors')
        .select('fab_tracking_id, inspector_id')
        .in('fab_tracking_id', trackingIds);

    const assignedInspMap = {};
    (inspAssignments || []).forEach(a => {
        if (!assignedInspMap[a.fab_tracking_id]) assignedInspMap[a.fab_tracking_id] = new Set();
        assignedInspMap[a.fab_tracking_id].add(a.inspector_id);
    });

    let html = '';
    data.forEach(r => {
        const startDelayed = !!(r.actual_start && r.planned_start && r.actual_start > r.planned_start);
        const endDelayed = !!(r.actual_end && r.planned_end && r.actual_end > r.planned_end);
        const delayed = startDelayed || endDelayed;
        const cardStyle = delayed ? ' style="border:2px solid #dc3545; background:#fff5f5;"' : '';

        html += '<div class="pr-card"' + cardStyle + '>';
        html += '<div class="pr-card-title">' + (r.pr_fab_steps_master?.step_order || '') + '. ' + (r.pr_fab_steps_master?.step_name || '') + (delayed ? ' <span style="color:#dc3545; font-size:12px;">&#9888; Delayed</span>' : '') + '</div>';

        if (r.pr_fab_steps_master?.inspection_format_id) {
            const fmtCode = r.pr_fab_steps_master.pr_inspection_formats_master?.code || 'Inspection';
            const hasReport = reportExistsSet.has(r.id);
            html += '<a class="pr-btn pr-btn-outline" style="margin-top:6px; display:inline-block;" href="inspection-report.html?fab_tracking=' + r.id + '&job=' + jobId + '">&#128206; ' + escapeHtml(fmtCode) + ' Inspection Sheet' + (hasReport ? '' : ' (not uploaded)') + '</a>';
        }

        html += '<div style="display:grid; grid-template-columns:1fr 1fr; gap:8px; margin-top:8px;">';
        html += '<div><label class="pr-label">Planned Start</label><input type="date" class="pr-input" value="' + (r.planned_start || '') + '" onchange="updateFabField(\'' + r.id + '\',\'planned_start\',this.value)"></div>';
        html += '<div><label class="pr-label">Planned End</label><input type="date" class="pr-input" value="' + (r.planned_end || '') + '" onchange="updateFabField(\'' + r.id + '\',\'planned_end\',this.value)"></div>';
        html += '<div><label class="pr-label"' + (startDelayed ? ' style="color:#dc3545;"' : '') + '>Actual Start</label><input type="date" class="pr-input" style="' + (startDelayed ? 'border:2px solid #dc3545;' : '') + '" value="' + (r.actual_start || '') + '" onchange="updateFabField(\'' + r.id + '\',\'actual_start\',this.value)"></div>';
        html += '<div><label class="pr-label"' + (endDelayed ? ' style="color:#dc3545;"' : '') + '>Actual End</label><input type="date" class="pr-input" style="' + (endDelayed ? 'border:2px solid #dc3545;' : '') + '" value="' + (r.actual_end || '') + '" onchange="updateFabField(\'' + r.id + '\',\'actual_end\',this.value)"></div>';
        html += '</div>';

        html += '<label class="pr-label" style="margin-top:6px;">Inspection</label>';
        html += '<select class="pr-select" onchange="updateFabField(\'' + r.id + '\',\'inspection_status\',this.value)">';
        ['Pending', 'Accept', 'Reject', 'Redo'].forEach(s => {
            html += '<option value="' + s + '"' + (r.inspection_status === s ? ' selected' : '') + '>' + s + '</option>';
        });
        html += '</select>';

        html += '<label class="pr-label">Inspection Date</label>';
        html += '<input type="date" class="pr-input" value="' + (r.inspection_date || '') + '" onchange="updateFabField(\'' + r.id + '\',\'inspection_date\',this.value)">';

        const assignedInspSet = assignedInspMap[r.id] || new Set();
        const assignedInsp = inspectorsList.filter(i => assignedInspSet.has(i.id));
        const availableInsp = inspectorsList.filter(i => !assignedInspSet.has(i.id));
        html += '<label class="pr-label">Inspectors</label>';
        html += '<div style="display:flex; flex-wrap:wrap; gap:6px; margin:4px 0 6px;">';
        if (assignedInsp.length === 0) {
            html += '<span style="font-size:12px; color:#999;">None assigned</span>';
        }
        assignedInsp.forEach(i => {
            html += '<span style="background:#e6edf5; color:#1e3a5f; padding:4px 8px; border-radius:12px; font-size:12px; display:inline-flex; align-items:center; gap:6px;">' + escapeHtml(i.inspector_name) + '<span style="cursor:pointer; font-weight:bold;" onclick="toggleFabInspector(\'' + r.id + '\',\'' + i.id + '\',false)">&times;</span></span>';
        });
        html += '</div>';
        if (availableInsp.length > 0) {
            html += '<select class="pr-select" onchange="if(this.value){toggleFabInspector(\'' + r.id + '\',this.value,true);}">';
            html += '<option value="">-- Add inspector --</option>';
            availableInsp.forEach(i => {
                html += '<option value="' + i.id + '">' + escapeHtml(i.inspector_name) + '</option>';
            });
            html += '</select>';
        } else if (inspectorsList.length === 0) {
            html += '<p class="pr-empty" style="margin:4px 0;">No inspectors added yet.</p>';
        }

        const assignedSet = assignedMap[r.id] || new Set();
        const assignedWorkers = workersList.filter(w => assignedSet.has(w.id));
        const availableWorkers = workersList.filter(w => !assignedSet.has(w.id));
        html += '<label class="pr-label" style="margin-top:8px;">Workers</label>';
        html += '<div style="display:flex; flex-wrap:wrap; gap:6px; margin:4px 0 6px;">';
        if (assignedWorkers.length === 0) {
            html += '<span style="font-size:12px; color:#999;">None assigned</span>';
        }
        assignedWorkers.forEach(w => {
            const label = escapeHtml(w.worker_name) + (w.category ? ' (' + escapeHtml(w.category) + ')' : '');
            html += '<span style="background:#e6edf5; color:#1e3a5f; padding:4px 8px; border-radius:12px; font-size:12px; display:inline-flex; align-items:center; gap:6px;">' + label + '<span style="cursor:pointer; font-weight:bold;" onclick="toggleFabWorker(\'' + r.id + '\',\'' + w.id + '\',false)">&times;</span></span>';
        });
        html += '</div>';
        if (availableWorkers.length > 0) {
            html += '<select class="pr-select" onchange="if(this.value){toggleFabWorker(\'' + r.id + '\',this.value,true);}">';
            html += '<option value="">-- Add worker --</option>';
            availableWorkers.forEach(w => {
                const label = escapeHtml(w.worker_name) + (w.category ? ' (' + escapeHtml(w.category) + ')' : '');
                html += '<option value="' + w.id + '">' + label + '</option>';
            });
            html += '</select>';
        } else if (workersList.length === 0) {
            html += '<p class="pr-empty" style="margin:4px 0;">No workers added yet.</p>';
        }

        if (startDelayed) {
            const startReasonRequired = !r.start_delay_reason;
            html += '<label class="pr-label" style="margin-top:8px;' + (startReasonRequired ? ' color:#dc3545;' : '') + '">Start Late Reason' + (startReasonRequired ? ' (required)' : '') + '</label>';
            html += '<input type="text" class="pr-input" style="' + (startReasonRequired ? 'border:2px solid #dc3545;' : '') + '" placeholder="' + (startReasonRequired ? 'Enter reason for late start' : '') + '" value="' + (r.start_delay_reason || '').replace(/"/g, '&quot;') + '" onchange="updateFabField(\'' + r.id + '\',\'start_delay_reason\',this.value)">';
        }
        if (endDelayed) {
            const endReasonRequired = !r.end_delay_reason;
            html += '<label class="pr-label" style="margin-top:8px;' + (endReasonRequired ? ' color:#dc3545;' : '') + '">End Late Reason' + (endReasonRequired ? ' (required)' : '') + '</label>';
            html += '<input type="text" class="pr-input" style="' + (endReasonRequired ? 'border:2px solid #dc3545;' : '') + '" placeholder="' + (endReasonRequired ? 'Enter reason for late end' : '') + '" value="' + (r.end_delay_reason || '').replace(/"/g, '&quot;') + '" onchange="updateFabField(\'' + r.id + '\',\'end_delay_reason\',this.value)">';
        }

        html += '</div>';
    });
    container.innerHTML = html;
}

async function updateFabField(trackingId, field, value) {
    const updateObj = {};
    updateObj[field] = value === '' ? null : value;
    const { error } = await supabaseClient.from('pr_fab_tracking').update(updateObj).eq('id', trackingId);
    if (error) { alert('Error saving: ' + error.message); return; }
    if (field === 'actual_start' || field === 'actual_end' || field === 'planned_start' || field === 'planned_end') {
        const { data: row } = await supabaseClient.from('pr_fab_tracking').select('planned_start, planned_end, actual_start, actual_end, start_delay_reason, end_delay_reason').eq('id', trackingId).single();
        if (row) {
            const startDelayed = !!(row.actual_start && row.planned_start && row.actual_start > row.planned_start);
            const endDelayed = !!(row.actual_end && row.planned_end && row.actual_end > row.planned_end);
            const missing = [];
            if (startDelayed && !row.start_delay_reason) missing.push('start');
            if (endDelayed && !row.end_delay_reason) missing.push('end');
            if (missing.length > 0) {
                alert('This step is delayed vs. plan. Please enter the ' + (missing.length > 1 ? 'reasons' : 'reason') + ' for the late ' + missing.join(' and ') + '.');
            }
        }
    }
    loadFabTable();
}

async function toggleFabWorker(trackingId, workerId, checked) {
    if (checked) {
        const { error } = await supabaseClient.from('pr_fab_tracking_workers').insert({ fab_tracking_id: trackingId, worker_id: workerId });
        if (error) { alert('Error assigning worker: ' + error.message); return; }
    } else {
        const { error } = await supabaseClient.from('pr_fab_tracking_workers').delete().eq('fab_tracking_id', trackingId).eq('worker_id', workerId);
        if (error) { alert('Error removing worker: ' + error.message); return; }
    }
    loadFabTable();
}

async function toggleFabInspector(trackingId, inspectorId, checked) {
    if (checked) {
        const { error } = await supabaseClient.from('pr_fab_tracking_inspectors').insert({ fab_tracking_id: trackingId, inspector_id: inspectorId });
        if (error) { alert('Error assigning inspector: ' + error.message); return; }
    } else {
        const { error } = await supabaseClient.from('pr_fab_tracking_inspectors').delete().eq('fab_tracking_id', trackingId).eq('inspector_id', inspectorId);
        if (error) { alert('Error removing inspector: ' + error.message); return; }
    }
    loadFabTable();
}

function escapeHtml(str) {
    return (str || '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
}

// ============ PAINTING ============
function loadPaintTabs() {
    const tabsDiv = document.getElementById('paintItemTabs');
    tabsDiv.innerHTML = '';
    paintItems.forEach((item, idx) => {
        const btn = document.createElement('button');
        btn.className = 'pr-btn ' + (idx === 0 ? 'pr-btn-primary' : 'pr-btn-outline');
        btn.textContent = item.item_name;
        btn.onclick = () => selectPaintItem(item.id, btn);
        tabsDiv.appendChild(btn);
    });
    if (paintItems.length > 0) {
        currentPaintItemId = paintItems[0].id;
        loadPaintTable();
    }
}

function selectPaintItem(itemId, btnEl) {
    currentPaintItemId = itemId;
    document.querySelectorAll('#paintItemTabs button').forEach(b => b.className = 'pr-btn pr-btn-outline');
    btnEl.className = 'pr-btn pr-btn-primary';
    loadPaintTable();
}

async function loadPaintTable() {
    const container = document.getElementById('paintTable');
    container.innerHTML = '<p class="pr-empty">Loading...</p>';

    const { data } = await supabaseClient
        .from('pr_paint_tracking')
        .select('id, start_date, start_time, stop_date, stop_time, remarks, process_id, pr_paint_process_master(process_name, process_order, inspection_format_id, pr_inspection_formats_master(code))')
        .eq('job_id', jobId)
        .eq('paint_item_id', currentPaintItemId);

    if (!data || data.length === 0) {
        container.innerHTML = '<p class="pr-empty">No painting processes found for this item.</p>';
        return;
    }

    data.sort((a, b) => (a.pr_paint_process_master?.process_order || 0) - (b.pr_paint_process_master?.process_order || 0));

    const paintTrackingIds = data.map(r => r.id);
    const { data: paintReports } = await supabaseClient
        .from('pr_inspection_reports')
        .select('paint_tracking_id')
        .in('paint_tracking_id', paintTrackingIds);
    const paintReportExistsSet = new Set((paintReports || []).map(r => r.paint_tracking_id));

    const { data: paintAssignments } = await supabaseClient
        .from('pr_paint_tracking_workers')
        .select('paint_tracking_id, worker_id')
        .in('paint_tracking_id', paintTrackingIds);
    const paintAssignedMap = {};
    (paintAssignments || []).forEach(a => {
        if (!paintAssignedMap[a.paint_tracking_id]) paintAssignedMap[a.paint_tracking_id] = new Set();
        paintAssignedMap[a.paint_tracking_id].add(a.worker_id);
    });

    const { data: paintInspAssignments } = await supabaseClient
        .from('pr_paint_tracking_inspectors')
        .select('paint_tracking_id, inspector_id')
        .in('paint_tracking_id', paintTrackingIds);
    const paintAssignedInspMap = {};
    (paintInspAssignments || []).forEach(a => {
        if (!paintAssignedInspMap[a.paint_tracking_id]) paintAssignedInspMap[a.paint_tracking_id] = new Set();
        paintAssignedInspMap[a.paint_tracking_id].add(a.inspector_id);
    });

    let html = '';
    data.forEach(r => {
        html += '<div class="pr-card">';
        html += '<div class="pr-card-title">' + (r.pr_paint_process_master?.process_order || '') + '. ' + (r.pr_paint_process_master?.process_name || '') + '</div>';

        if (r.pr_paint_process_master?.inspection_format_id) {
            const fmtCode = r.pr_paint_process_master.pr_inspection_formats_master?.code || 'Inspection';
            const hasReport = paintReportExistsSet.has(r.id);
            html += '<a class="pr-btn pr-btn-outline" style="margin-top:6px; display:inline-block;" href="inspection-report.html?paint_tracking=' + r.id + '&job=' + jobId + '">&#128206; ' + escapeHtml(fmtCode) + ' Inspection Sheet' + (hasReport ? '' : ' (not uploaded)') + '</a>';
        }

        html += '<div style="display:grid; grid-template-columns:1fr 1fr; gap:8px; margin-top:8px;">';
        html += '<div><label class="pr-label">Start Date</label><input type="date" class="pr-input" value="' + (r.start_date || '') + '" onchange="updatePaintField(\'' + r.id + '\',\'start_date\',this.value)"></div>';
        html += '<div><label class="pr-label">Start Time</label><input type="time" class="pr-input" value="' + (r.start_time || '') + '" onchange="updatePaintField(\'' + r.id + '\',\'start_time\',this.value)"></div>';
        html += '<div><label class="pr-label">Stop Date</label><input type="date" class="pr-input" value="' + (r.stop_date || '') + '" onchange="updatePaintField(\'' + r.id + '\',\'stop_date\',this.value)"></div>';
        html += '<div><label class="pr-label">Stop Time</label><input type="time" class="pr-input" value="' + (r.stop_time || '') + '" onchange="updatePaintField(\'' + r.id + '\',\'stop_time\',this.value)"></div>';
        html += '</div>';

        const paintAssignedSet = paintAssignedMap[r.id] || new Set();
        const paintAssignedWorkers = workersList.filter(w => paintAssignedSet.has(w.id));
        const paintAvailableWorkers = workersList.filter(w => !paintAssignedSet.has(w.id));
        html += '<label class="pr-label" style="margin-top:8px;">Workers</label>';
        html += '<div style="display:flex; flex-wrap:wrap; gap:6px; margin:4px 0 6px;">';
        if (paintAssignedWorkers.length === 0) {
            html += '<span style="font-size:12px; color:#999;">None assigned</span>';
        }
        paintAssignedWorkers.forEach(w => {
            const label = escapeHtml(w.worker_name) + (w.category ? ' (' + escapeHtml(w.category) + ')' : '');
            html += '<span style="background:#e6edf5; color:#1e3a5f; padding:4px 8px; border-radius:12px; font-size:12px; display:inline-flex; align-items:center; gap:6px;">' + label + '<span style="cursor:pointer; font-weight:bold;" onclick="togglePaintWorker(\'' + r.id + '\',\'' + w.id + '\',false)">&times;</span></span>';
        });
        html += '</div>';
        if (paintAvailableWorkers.length > 0) {
            html += '<select class="pr-select" onchange="if(this.value){togglePaintWorker(\'' + r.id + '\',this.value,true);}">';
            html += '<option value="">-- Add worker --</option>';
            paintAvailableWorkers.forEach(w => {
                const label = escapeHtml(w.worker_name) + (w.category ? ' (' + escapeHtml(w.category) + ')' : '');
                html += '<option value="' + w.id + '">' + label + '</option>';
            });
            html += '</select>';
        } else if (workersList.length === 0) {
            html += '<p class="pr-empty" style="margin:4px 0;">No workers added yet.</p>';
        }

        const paintAssignedInspSet = paintAssignedInspMap[r.id] || new Set();
        const paintAssignedInsp = inspectorsList.filter(i => paintAssignedInspSet.has(i.id));
        const paintAvailableInsp = inspectorsList.filter(i => !paintAssignedInspSet.has(i.id));
        html += '<label class="pr-label" style="margin-top:8px;">Inspectors</label>';
        html += '<div style="display:flex; flex-wrap:wrap; gap:6px; margin:4px 0 6px;">';
        if (paintAssignedInsp.length === 0) {
            html += '<span style="font-size:12px; color:#999;">None assigned</span>';
        }
        paintAssignedInsp.forEach(i => {
            html += '<span style="background:#e6edf5; color:#1e3a5f; padding:4px 8px; border-radius:12px; font-size:12px; display:inline-flex; align-items:center; gap:6px;">' + escapeHtml(i.inspector_name) + '<span style="cursor:pointer; font-weight:bold;" onclick="togglePaintInspector(\'' + r.id + '\',\'' + i.id + '\',false)">&times;</span></span>';
        });
        html += '</div>';
        if (paintAvailableInsp.length > 0) {
            html += '<select class="pr-select" onchange="if(this.value){togglePaintInspector(\'' + r.id + '\',this.value,true);}">';
            html += '<option value="">-- Add inspector --</option>';
            paintAvailableInsp.forEach(i => {
                html += '<option value="' + i.id + '">' + escapeHtml(i.inspector_name) + '</option>';
            });
            html += '</select>';
        } else if (inspectorsList.length === 0) {
            html += '<p class="pr-empty" style="margin:4px 0;">No inspectors added yet.</p>';
        }

        html += '<label class="pr-label" style="margin-top:8px;">Remarks</label>';
        html += '<input type="text" class="pr-input" value="' + (r.remarks || '').replace(/"/g, '&quot;') + '" onchange="updatePaintField(\'' + r.id + '\',\'remarks\',this.value)">';
        html += '</div>';
    });
    container.innerHTML = html;
}

async function togglePaintWorker(trackingId, workerId, checked) {
    if (checked) {
        const { error } = await supabaseClient.from('pr_paint_tracking_workers').insert({ paint_tracking_id: trackingId, worker_id: workerId });
        if (error) { alert('Error assigning worker: ' + error.message); return; }
    } else {
        const { error } = await supabaseClient.from('pr_paint_tracking_workers').delete().eq('paint_tracking_id', trackingId).eq('worker_id', workerId);
        if (error) { alert('Error removing worker: ' + error.message); return; }
    }
    loadPaintTable();
}

async function togglePaintInspector(trackingId, inspectorId, checked) {
    if (checked) {
        const { error } = await supabaseClient.from('pr_paint_tracking_inspectors').insert({ paint_tracking_id: trackingId, inspector_id: inspectorId });
        if (error) { alert('Error assigning inspector: ' + error.message); return; }
    } else {
        const { error } = await supabaseClient.from('pr_paint_tracking_inspectors').delete().eq('paint_tracking_id', trackingId).eq('inspector_id', inspectorId);
        if (error) { alert('Error removing inspector: ' + error.message); return; }
    }
    loadPaintTable();
}

async function updatePaintField(trackingId, field, value) {
    const updateObj = {};
    updateObj[field] = value === '' ? null : value;
    const { error } = await supabaseClient.from('pr_paint_tracking').update(updateObj).eq('id', trackingId);
    if (error) alert('Error saving: ' + error.message);
}

if (session && jobId) init();

</script>
