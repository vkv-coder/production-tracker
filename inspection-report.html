<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Production Tracker - Inspection Sheet</title>
<link rel="manifest" href="manifest.json">
<link rel="stylesheet" href="style.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
</head>
<body>

<div class="pr-header">
    <h1 id="reportHeader">Inspection Sheet</h1>
    <button class="logout-btn" style="background:#555;" onclick="goBack()">Back</button>
</div>

<div class="pr-container">
    <p id="subHeader" style="font-size:13px; color:#666; margin-top:-8px; margin-bottom:12px;"></p>
    <div id="reportCard"><p class="pr-empty">Loading...</p></div>
</div>

<script src="config.js"></script>
<script>

const session = requireLogin();
const urlParams = new URLSearchParams(window.location.search);
const fabTrackingId = urlParams.get('fab_tracking');
const paintTrackingId = urlParams.get('paint_tracking');
const jobId = urlParams.get('job');
const sourceType = fabTrackingId ? 'fab' : 'paint';
const trackingId = fabTrackingId || paintTrackingId;
const sourceCol = sourceType === 'fab' ? 'fab_tracking_id' : 'paint_tracking_id';

let jobRecord = null;
let report = null;
let format = null;
let gridData = [];

function goBack() {
    window.location.href = 'job-detail.html?job=' + jobId;
}

async function init() {
    if (!trackingId || !jobId) {
        document.getElementById('reportCard').innerHTML = '<p class="pr-empty">No step specified.</p>';
        return;
    }

    const { data: job } = await supabaseClient.from('pr_jobs').select('job_no').eq('id', jobId).maybeSingle();
    jobRecord = job;

    let masterInfo = null;
    if (sourceType === 'fab') {
        const { data: tracking } = await supabaseClient
            .from('pr_fab_tracking')
            .select('id, pr_fab_steps_master(step_name, inspection_format_id)')
            .eq('id', trackingId)
            .maybeSingle();
        masterInfo = tracking ? { stepName: tracking.pr_fab_steps_master?.step_name, formatId: tracking.pr_fab_steps_master?.inspection_format_id } : null;
    } else {
        const { data: tracking } = await supabaseClient
            .from('pr_paint_tracking')
            .select('id, pr_paint_process_master(process_name, inspection_format_id)')
            .eq('id', trackingId)
            .maybeSingle();
        masterInfo = tracking ? { stepName: tracking.pr_paint_process_master?.process_name, formatId: tracking.pr_paint_process_master?.inspection_format_id } : null;
    }

    if (!masterInfo || !masterInfo.formatId) {
        document.getElementById('reportCard').innerHTML = '<p class="pr-empty">No inspection format attached to this step.</p>';
        return;
    }

    const { data: fmt } = await supabaseClient.from('pr_inspection_formats_master').select('code, name').eq('id', masterInfo.formatId).maybeSingle();
    format = fmt;

    document.getElementById('reportHeader').textContent = format ? (format.code + ' — ' + format.name) : 'Inspection Sheet';
    document.getElementById('subHeader').textContent = (jobRecord ? jobRecord.job_no : '') + ' · ' + (masterInfo.stepName || '');

    report = await getOrCreateReport(masterInfo.formatId);
    if (report) await loadSheetIntoGrid();
}

async function getOrCreateReport(formatId) {
    const { data: existing } = await supabaseClient.from('pr_inspection_reports').select('*').eq(sourceCol, trackingId).maybeSingle();
    if (existing) return existing;

    const insertObj = {
        company_id: session.companyId,
        job_id: jobId,
        format_id: formatId
    };
    insertObj[sourceCol] = trackingId;

    const { data: created, error } = await supabaseClient.from('pr_inspection_reports').insert(insertObj).select('*').single();
    if (error) {
        // Race: another tab/device created it first — re-select instead of failing
        const { data: retryExisting } = await supabaseClient.from('pr_inspection_reports').select('*').eq(sourceCol, trackingId).maybeSingle();
        if (retryExisting) return retryExisting;
        document.getElementById('reportCard').innerHTML = '<p class="pr-empty">⚠️ Could not open sheet: ' + error.message + '</p>';
        return null;
    }
    return created;
}

function blankGrid() {
    return Array.from({ length: 8 }, () => Array(6).fill(''));
}

async function loadSheetIntoGrid() {
    const container = document.getElementById('reportCard');
    container.innerHTML = '<p class="pr-empty">Loading sheet...</p>';

    if (report.file_path) {
        const { data: blob, error } = await supabaseClient.storage.from('inspection-sheets').download(report.file_path);
        if (error) {
            container.innerHTML = '<p class="pr-empty">⚠️ Could not load sheet file: ' + escapeHtml(error.message) + '</p>';
            return;
        }
        try {
            const arrayBuffer = await blob.arrayBuffer();
            const wb = XLSX.read(arrayBuffer, { type: 'array' });
            const ws = wb.Sheets[wb.SheetNames[0]];
            gridData = XLSX.utils.sheet_to_json(ws, { header: 1, defval: '' }).map(row => row.map(c => String(c)));
            if (gridData.length === 0) gridData = blankGrid();
        } catch (e) {
            container.innerHTML = '<p class="pr-empty">⚠️ Could not read this file as a spreadsheet (' + escapeHtml(e.message) + '). Download it below instead.</p>' +
                '<button class="pr-btn pr-btn-primary" style="margin-top:8px;" onclick="downloadSheet()">Download</button>';
            return;
        }
    } else {
        gridData = blankGrid();
    }
    renderGrid();
}

function renderGrid() {
    const container = document.getElementById('reportCard');
    let html = '';

    if (report.uploaded_at) {
        html += '<p style="font-size:12px; color:#666; margin:0 0 8px;">Last saved by ' + escapeHtml(report.uploaded_by || '-') + ' on ' + new Date(report.uploaded_at).toLocaleString() + '</p>';
    }

    html += '<div style="display:flex; gap:8px; flex-wrap:wrap; margin-bottom:10px;">';
    html += '<button class="pr-btn pr-btn-primary" onclick="saveSheetGrid()">Save</button>';
    html += '<button class="pr-btn pr-btn-outline" onclick="addRow()">+ Row</button>';
    html += '<button class="pr-btn pr-btn-outline" onclick="addColumn()">+ Column</button>';
    if (report.file_path) {
        html += '<button class="pr-btn pr-btn-outline" onclick="downloadSheet()">Download Copy</button>';
        html += '<button class="pr-btn pr-btn-danger" onclick="deleteSheet()">Clear Sheet</button>';
    }
    html += '</div>';

    html += '<div style="overflow-x:auto; border:1px solid #ddd; border-radius:6px;">';
    html += '<table style="border-collapse:collapse; width:100%;">';
    gridData.forEach((row, r) => {
        html += '<tr>';
        row.forEach((cell, c) => {
            html += '<td style="padding:0; border:1px solid #eee;"><input value="' + escapeHtml(cell) + '" onchange="updateCell(' + r + ',' + c + ',this.value)" style="border:none; padding:6px 8px; font-size:13px; width:110px; min-width:110px;"></td>';
        });
        html += '</tr>';
    });
    html += '</table></div>';

    container.innerHTML = html;
}

function updateCell(r, c, value) {
    gridData[r][c] = value;
}

function addRow() {
    const cols = gridData.length > 0 ? gridData[0].length : 6;
    gridData.push(Array(cols).fill(''));
    renderGrid();
}

function addColumn() {
    gridData.forEach(row => row.push(''));
    renderGrid();
}

async function saveSheetGrid() {
    const ws = XLSX.utils.aoa_to_sheet(gridData);
    const wb = XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(wb, ws, 'Sheet1');
    const wbout = XLSX.write(wb, { type: 'array', bookType: 'xlsx' });
    const blob = new Blob([wbout], { type: 'application/octet-stream' });

    const fileName = (report.file_name && report.file_name.trim()) || ((format ? format.code : 'sheet') + '.xlsx');
    const path = session.companyId + '/' + report.id + '/' + fileName;

    const { error: uploadError } = await supabaseClient.storage.from('inspection-sheets').upload(path, blob, { upsert: true });
    if (uploadError) { alert('Error saving: ' + uploadError.message); return; }

    const { data: updated, error } = await supabaseClient
        .from('pr_inspection_reports')
        .update({ file_path: path, file_name: fileName, uploaded_by: session.name, uploaded_at: new Date().toISOString() })
        .eq('id', report.id)
        .select('*')
        .single();
    if (error) { alert('Error saving: ' + error.message); return; }

    report = updated;
    renderGrid();
}

async function downloadSheet() {
    if (!report.file_path) return;
    const { data, error } = await supabaseClient.storage.from('inspection-sheets').createSignedUrl(report.file_path, 300);
    if (error) { alert('Error: ' + error.message); return; }
    window.open(data.signedUrl, '_blank');
}

async function deleteSheet() {
    if (!confirm('Clear the sheet for this step? This removes the saved file; the grid will reset to blank. This cannot be undone.')) return;
    if (report.file_path) {
        await supabaseClient.storage.from('inspection-sheets').remove([report.file_path]);
    }
    const { data: updated, error } = await supabaseClient
        .from('pr_inspection_reports')
        .update({ file_path: null, file_name: null, uploaded_by: null, uploaded_at: null })
        .eq('id', report.id)
        .select('*')
        .single();
    if (error) { alert('Error: ' + error.message); return; }
    report = updated;
    gridData = blankGrid();
    renderGrid();
}

function escapeHtml(str) {
    return (str || '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
}

if (session) init();

</script>

</body>
</html>
